# Sources read through RSS, Atom or JSON Feed.
#
# Every [[source]] has:
#   id       unique short name (letters, digits, dashes)
#   name     shown in the overview
#   url      address of the feed
#   lang     language of the source (sk, cs, en, ...)
#   region   where the source reports from, used when nothing better is known
#   group    filter group in the overview (e.g. "Slovenské", "České", "Svetové", "Tech a veda")
# Optional:
#   area     default area when none is recognized (see [areas] in settings.toml)
#   enabled  false turns the source off without deleting it
#   include  regular expression; only article URLs matching it are taken
#   exclude  regular expression; article URLs matching it are skipped
#   max_items  overrides max_items_per_source from settings.toml

