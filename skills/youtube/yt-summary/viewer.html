  // ---------- adding videos: links or a YouTube search, the overview, then yt-fetch downloads in the background ----------
  const PLUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
  const addDialog = document.getElementById("add-dialog");
  let downloads = [], downloadsTimer = null, addText = "", addRun = 0, found = [];
  const surveys = {};
  const downloadsActive = () => downloads.some(d => d.state === "queued" || d.state === "running");
  const addButton = () => CONFIG.add ? `<button class="gear add-button${downloadsActive() ? " busy" : ""}" data-add aria-haspopup="dialog"
    aria-label="${esc(label("add"))}" title="${esc(label("add"))}">${PLUS}</button>` : "";
  const topButtons = () => `<div class="top-buttons">${addButton()}${settingsButton()}</div>`;
  const LINK = /^(https?:\/\/|www\.|m\.youtube\.|youtube\.com|youtu\.be|@[\w.-]+$)/i;
  const compact = n => { try { return new Intl.NumberFormat(document.documentElement.lang || "en", {notation: "compact"}).format(n); } catch (e) { return String(n); } };
  const planName = path => String(path).split(/[\\/]/).pop();

  async function postJson(url, body) {
    const response = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
      body: JSON.stringify(body)});
    const data = response.headers.get("Content-Type")?.includes("json") ? await response.json() : {};
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }
  function summarizeAfter() { try { return localStorage.getItem("yt-summary-add-summarize") === "1"; } catch (e) { return false; } }

  function addFrame(body, footer = "") {
    addRun++;
    addDialog.setAttribute("aria-label", label("add_title"));
    addDialog.innerHTML = `<div class="add-head"><h2>${esc(label("add_title"))}</h2>
        <button type="button" class="add-close" data-add-close aria-label="${esc(label("add_close"))}">×</button></div>
      <div class="add-body">${body}</div>
      ${footer ? `<div class="add-foot">${footer}</div>` : ""}
      <div id="add-downloads"></div>`;
    renderDownloads();
    return addRun;
  }
  const backButton = () => `<button type="button" class="action secondary" data-add-back>← ${esc(label("add_back"))}</button>`;
  const summarizeBox = () => CONFIG.summarize ? `<label class="check"><input type="checkbox" id="add-summarize"${summarizeAfter() ? " checked" : ""}>
    <span>${esc(label("add_summarize"))}<span class="note">${esc(label("add_summarize_note", {model: CONFIG.model}))}</span></span></label>` : "";

  function showAddStart() {
    addFrame(`<form id="add-form"><label for="add-text">${esc(label("add_hint"))}</label>
      <textarea id="add-text" rows="4" placeholder="${esc(label("add_placeholder"))}" spellcheck="false">${esc(addText)}</textarea>
      <p class="note">${esc(label("add_note"))}</p>
      <div class="add-actions"><button type="submit" class="action">${esc(label("add_next"))}</button></div></form>`);
  }
  function openAdd() {
    closeSettings();
    showAddStart();
    if (!addDialog.open) addDialog.showModal();
    document.getElementById("add-text").focus();
    refreshDownloads();
  }

  // ---------- search on YouTube: tick the videos to add ----------
  async function showSearch(query) {
    const run = addFrame(`<p class="add-wait"><span class="spinner"></span>${esc(label("add_searching"))}</p>`, backButton());
    try { found = await postJson("/api/add/search", {query}); }
    catch (err) { if (run === addRun) addFailed(err); return; }
    if (run !== addRun) return;
    const rows = found.map(v => {
      const off = v.in_archive || v.live;
      return `<li><label class="${off ? "off" : ""}"><input type="checkbox" value="${esc(v.id)}"${off ? " disabled" : ""}>
        <img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy">
        <span><a class="title" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <span class="meta">${esc(v.channel || "")}${v.duration ? ` · ${hms(v.duration)}` : ""}${v.views ? ` · ${esc(label("add_views", {n: compact(v.views)}))}` : ""}</span>
          ${v.in_archive ? `<span class="badge">${esc(label("add_in_archive"))}</span>` : v.live ? `<span class="badge">${esc(label("add_live"))}</span>` : ""}</span>
      </label></li>`;
    }).join("");
    addFrame(found.length ? `<h3>${esc(label("add_results", {query}))}</h3><ul class="add-results">${rows}</ul>`
        : `<p class="empty">${esc(label("add_no_results", {query}))}</p>`,
      `${backButton()}<span class="grow">${summarizeBox()}</span>
       ${found.length ? `<button type="button" class="action" data-add-picked disabled>${esc(label("add_selected", {n: 0}))}</button>` : ""}`);
  }

  // ---------- links: an overview per link, the same as yt-fetch shows before downloading ----------
  function showSurveys(links) {
    addFrame(links.map((url, i) => `<section class="add-card" id="add-card-${i}"></section>`).join(""),
      `${backButton()}<span class="grow">${summarizeBox()}</span>`);
    links.forEach((url, i) => survey(url, i, {}));
  }
  async function survey(url, i, filters) {
    const run = addRun, card = () => run === addRun ? document.getElementById(`add-card-${i}`) : null;
    card().innerHTML = `<p class="add-wait"><span class="spinner"></span>${esc(label("add_surveying"))}<span class="meta">${esc(url)}</span></p>`;
    try {
      const data = await postJson("/api/add/survey", {url, ...filters});
      surveys[i] = {url, data};
      if (card()) card().innerHTML = overviewCard(data, i);
    } catch (err) {
      if (card()) card().innerHTML = `<p class="job error">${esc(label("add_error", {error: err.message}))}</p><p class="meta">${esc(url)}</p>`;
    }
  }
  const typeName = t => label(`add_type_${t === "?" ? "unknown" : t}`);
  const downloadButton = (d, sample, text, title) => `<button type="button" class="action${sample ? " secondary" : ""}"
    data-add-plan="${esc(planName(d.plan))}" data-sample="${sample ? "1" : ""}" data-title="${esc(title)}">${esc(text)}</button>`;
  const target = d => d.target ? `<p class="meta">${esc(label("add_target", {path: d.target}))}</p>` : "";

  function overviewCard(d, i) {
    if (d.kind === "video") {
      const v = d.video;
      const transcript = v.transcript ? label("add_transcript", {language: v.transcript.language,
        kind: label(v.transcript.kind === "manual" ? "add_captions_manual" : "add_captions_auto")}) : label("add_no_transcript");
      const status = {new: "", in_archive: label("add_video_in_archive"), not_yet: label("add_video_not_yet")}[v.status];
      return `<div class="add-kind">${esc(label("add_kind_video"))}</div><h3>${esc(v.title)}</h3>
        <p class="meta">${esc(v.channel || "")} · ${esc(day(v.upload_date))} · ${hms(v.duration)}</p>
        <p class="meta">${esc(transcript)}</p>${status ? `<p class="meta">${esc(status)}</p>` : ""}${target(d)}
        <div class="add-actions">${v.status === "not_yet" ? "" : downloadButton(d, false, label(v.status === "in_archive" ? "add_check_video" : "add_download_video"), v.title)}
          ${d.playlist_id ? `<button type="button" class="action secondary" data-add-playlist="${esc(d.playlist_id)}" data-card="${i}">${esc(label("add_whole_playlist"))}</button>` : ""}</div>`;
    }
    const name = d.kind === "channel" ? `${d.title || d.id}${d.handle ? ` (${d.handle})` : ""}` : `${d.title || d.id}${d.channel ? ` · ${d.channel}` : ""}`;
    const chosen = d.options.types;
    const rows = d.rows.map(r => r.skipped
      ? `<tr class="off"><td>${esc(typeName(r.type))}</td><td>–</td><td>${esc(label("add_skipped"))}</td></tr>`
      : `<tr><td>${esc(typeName(r.type))}</td><td>${r.count}</td><td>${r.count && r.count === r.missing ? "?" : hms(r.seconds) + (r.missing ? "+" : "")}</td></tr>`).join("");
    const notes = [
      d.skipped_known ? label("add_known", {n: d.skipped_known}) : "",
      d.unavailable ? label("add_unavailable", {n: d.unavailable}) : "",
      d.missing ? label("add_no_duration") : "",
      d.options.since ? label("add_since_note") : "",
      d.count ? label("add_estimate", {n: d.minutes}) : label("add_nothing"),
    ].filter(Boolean);
    return `<div class="add-kind">${esc(label(`add_kind_${d.kind}`))}</div><h3>${esc(name)}</h3>${target(d)}
      <div class="add-filters" data-card="${i}">
        ${d.types.length > 1 || chosen ? d.types.map(t => `<label><input type="checkbox" value="${esc(t)}"${!chosen || chosen.includes(t) ? " checked" : ""}>${esc(typeName(t))}</label>`).join("") : ""}
        <label>${esc(label("add_since"))} <input type="date" value="${esc(d.options.since || "")}"></label>
        <button type="button" data-add-refilter="${i}">${esc(label("add_refilter"))}</button>
      </div>
      <table class="add-table"><tr><th></th><th>${esc(label("add_col_count"))}</th><th>${esc(label("add_col_time"))}</th></tr>${rows}
        <tr class="total"><td>${esc(label("add_total"))}</td><td>${d.count}</td><td>${hms(d.seconds)}${d.missing ? "+" : ""}</td></tr></table>
      <ul class="add-notes">${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      ${d.sample.length ? `<h4>${esc(label("add_sample", {n: d.sample.length}))}</h4><ol class="add-sample">${d.sample.map(v =>
        `<li>${esc(v.title)} <span class="meta">· ${v.views ? esc(label("add_views", {n: compact(v.views)})) + " · " : ""}${v.duration ? hms(v.duration) : "?"}</span></li>`).join("")}</ol>` : ""}
      ${d.count ? `<div class="add-actions">${downloadButton(d, false, label("add_download_all", {n: d.count}), name)}
        ${d.sample.length ? downloadButton(d, true, label("add_download_sample", {n: d.sample.length}), name) : ""}</div>` : ""}`;
  }

  function addFailed(err) {
    addFrame(`<p class="job error">${esc(label("add_error", {error: err.message}))}</p>`, backButton());
  }

  async function startDownload(body, place) {
    const summarize = Boolean(document.getElementById("add-summarize")?.checked);
    try { localStorage.setItem("yt-summary-add-summarize", summarize ? "1" : "0"); } catch (e) {}
    try {
      const item = await postJson("/api/add/download", {...body, summarize});
      downloads = [...downloads.filter(d => d.id !== item.id), item];
      place.innerHTML = `<p class="done">✓ ${esc(label("add_started"))}</p>`;
    } catch (err) {
      place.insertAdjacentHTML("beforeend", `<p class="job error">${esc(label("add_error", {error: err.message}))}</p>`);
      return;
    }
    renderDownloads();
    updateAddButton();
    refreshDownloads();
  }

  addDialog.addEventListener("submit", e => {
    if (e.target.id !== "add-form") return;
    e.preventDefault();
    addText = document.getElementById("add-text").value;
    const lines = addText.split(/\n/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) return;
    const links = lines.filter(line => LINK.test(line)).map(line => line.startsWith("@") ? `https://www.youtube.com/${line}` : line);
    if (links.length) showSurveys([...new Set(links)]);
    else showSearch(lines.join(" "));
  });
  addDialog.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "add-text") document.getElementById("add-form").requestSubmit();
  });
  addDialog.addEventListener("change", e => {
    if (!e.target.closest(".add-results")) return;
    const picked = addDialog.querySelectorAll(".add-results input:checked").length;
    const button = addDialog.querySelector("[data-add-picked]");
    button.disabled = !picked;
    button.textContent = label("add_selected", {n: picked});
  });
  addDialog.addEventListener("click", e => {
    if (e.target === addDialog) return addDialog.close();  // the backdrop
    const button = e.target.closest("button");
    if (!button) return;
    if (button.matches("[data-add-close]")) addDialog.close();
    else if (button.matches("[data-add-back]")) { showAddStart(); document.getElementById("add-text").focus(); }
    else if (button.matches("[data-add-plan]")) {
      button.disabled = true;
      startDownload({plan: button.dataset.addPlan, sample: Boolean(button.dataset.sample), title: button.dataset.title},
        button.closest(".add-actions"));
    } else if (button.matches("[data-add-picked]")) {
      const ids = [...addDialog.querySelectorAll(".add-results input:checked")].map(input => input.value);
      const title = ids.length === 1 ? found.find(v => v.id === ids[0]).title : label("add_picked_title", {n: ids.length});
      button.disabled = true;
      const place = document.createElement("div");
      addDialog.querySelector(".add-body").prepend(place);
      startDownload({ids, title}, place).then(() => {
        addDialog.querySelectorAll(".add-results input:checked").forEach(input => { input.checked = false; input.disabled = true; });
      });
    } else if (button.matches("[data-add-refilter]")) {
      const box = button.closest(".add-filters"), i = Number(button.dataset.addRefilter);
      const boxes = [...box.querySelectorAll("input[type=checkbox]")];
      const types = boxes.length && boxes.some(b => !b.checked) ? boxes.filter(b => b.checked).map(b => b.value) : [];
      if (boxes.length && !types.length && boxes.some(b => !b.checked)) return;  // nothing ticked
      survey(surveys[i].url, i, {types, since: box.querySelector("input[type=date]").value});
    } else if (button.matches("[data-add-playlist]")) {
      survey(`https://www.youtube.com/playlist?list=${button.dataset.addPlaylist}`, Number(button.dataset.card), {});
    }
  });

  // ---------- downloads in progress: shown in the dialog; the + button pulses while one runs ----------
  function renderDownloads() {
    const box = document.getElementById("add-downloads");
    if (!box) return;
    box.innerHTML = downloads.length ? `<h3>${esc(label("add_downloads"))}</h3><ul>${downloads.slice().reverse().map(d => {
      const status = d.state === "queued" ? `<span class="spinner"></span>${esc(label("add_dl_queued"))}`
        : d.state === "running" ? `<span class="spinner"></span>${esc(d.total ? label("add_dl_running", {done: d.done, total: d.total}) : label("add_dl_starting"))}`
        : d.state === "done" ? `✓ ${esc(plural("add_dl_done", d.added))}${d.summaries ? ` · ${esc(label("add_dl_summaries", {n: d.summaries}))}` : ""}`
        : `<span class="error">${esc(label("add_dl_error", {error: d.error}))}${d.added ? ` · ${esc(plural("add_dl_done", d.added))}` : ""}</span>`;
      const last = d.state === "running" && d.last ? `<span class="meta last">${esc(d.last.replace(/ … .*$/, ""))}</span>` : "";
      return `<li><b>${esc(d.title || label("add_title"))}</b><span class="meta">${status}</span>${last}</li>`;
    }).join("")}</ul>` : "";
  }
  function updateAddButton() {
    document.querySelectorAll("[data-add]").forEach(b => b.classList.toggle("busy", downloadsActive()));
  }
  async function refreshDownloads() {
    clearTimeout(downloadsTimer);
    const before = new Map(downloads.map(d => [d.id, d.state]));
    try { downloads = await getJson("/api/downloads"); } catch (e) { return; }
    renderDownloads();
    updateAddButton();
    const finished = downloads.some(d => ["queued", "running"].includes(before.get(d.id)) && !["queued", "running"].includes(d.state));
    if (finished) {
      if (pageKind === "archive") {  // the new videos and channels appear in the list
        const y = scrollPos();
        await showArchive(scope);
        setScroll(y);
      }
      refreshJobs();
    }
    if (downloadsActive()) downloadsTimer = setTimeout(refreshDownloads, 2000);
  }
  document.addEventListener("click", e => {
    if (e.target.closest("[data-add]")) openAdd();
  });

  // ---------- player: times seek the embedded video; without a working player they open YouTube (their href) ----------
  let apiLoading = null;
  function loadApi() {
    if (window.YT && YT.Player) return Promise.resolve();
    return apiLoading ??= new Promise((resolve, reject) => {
      window.onYouTubeIframeAPIReady = resolve;
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  function fallback(id) {
    if (ready || id !== videoId) return;
    document.body.classList.add("no-player");
    const frame = document.querySelector(".frame");
    if (frame) frame.innerHTML = `<a class="poster" href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener"
      style="background-image:url(/api/thumb/${esc(id)})"></a>`;
    player = null;
  }

  function startPlayer(id) {
    playerTimer = setTimeout(() => fallback(id), 10000);
    loadApi().then(() => {
      if (id !== videoId) return;
      player = new YT.Player("player", {
        videoId: id, playerVars: {rel: 0, modestbranding: 1},
        events: {
          onReady: () => { ready = true; clearTimeout(playerTimer); },
          onError: () => { ready = false; fallback(id); },
        },
      });
    }, () => fallback(id));
  }

  function stopPlayer() {
    clearTimeout(playerTimer);
    if (player && player.destroy) player.destroy();
    player = null; ready = false;
    document.body.classList.remove("no-player");
  }

  document.addEventListener("click", e => {
    const link = e.target.closest("a.t");
    if (!link || !ready || !player) return;
    e.preventDefault();
    player.seekTo(Number(link.dataset.t), true);
    player.playVideo();
  });

  // Topics panel: a click on a topic plays the video from it and scrolls the summary to the idea of that time.
  function closeToc() {
    document.getElementById("toc")?.classList.remove("open");
    document.querySelector(".toc-toggle")?.setAttribute("aria-expanded", "false");
  }
  document.addEventListener("click", e => {
    const toggle = e.target.closest(".toc-toggle"), toc = document.getElementById("toc");
    if (toggle && toc) {
      const open = !toc.classList.contains("open");
      toc.classList.toggle("open", open);
      toggle.setAttribute("aria-expanded", String(open));
      return;
    }
    const item = e.target.closest("aside.toc li[data-t]");
    if (!item) {
      if (toc && toc.classList.contains("open") && !toc.contains(e.target)) closeToc();
      return;
    }
    e.preventDefault();  // also for the time link: the same seek, plus the scroll
    const t = Number(item.dataset.t);
    if (ready && player) { player.seekTo(t, true); player.playVideo(); }
    else if (!e.target.closest("a.t")) window.open(item.querySelector("a.t").href, "_blank", "noopener");
    else window.open(e.target.closest("a.t").href, "_blank", "noopener");
    document.querySelectorAll("aside.toc li").forEach(li => li.classList.toggle("active", li === item));
    scrollToIdea(t);
    closeToc();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeToc(); });

  // The idea a topic belongs to: the one going on at the topic's start (a few seconds of tolerance), as the
  // highlight of the idea being played marks it; before the first idea, the first one.
  function scrollToIdea(start) {
    const ideas = [...document.querySelectorAll(".idea")].map(el => [Number(el.dataset.t), el]).sort((a, b) => a[0] - b[0]);
    const target = (ideas.filter(([t]) => t <= start + 5).pop() || ideas[0] || [])[1];
    if (!target) return;
    if (document.querySelector(".tabs") && currentTab() !== "ideas") showTab("ideas");
    const panel = target.closest(".scroller");
    panel?.scrollTo({top: target.getBoundingClientRect().top - panel.getBoundingClientRect().top + panel.scrollTop - 12,
                     behavior: document.visibilityState === "visible" ? "smooth" : "auto"});
    document.querySelectorAll(".idea").forEach(el => el.classList.toggle("active", el === target));
  }

  // ---------- flow of the video ----------
  // Kinds of talk and their level (as in summary.py and ANALYSIS.md); left of the axis nothing on the subject.
  const FLOW_KINDS = {silence: -4, promo: -3, smalltalk: -2, tangent: -1, frame: 0, context: 1, loose: 2, solid: 3, dense: 4};
  const OLD_KINDS = {topic: "solid", key: "dense", breakthrough: "dense"};  // flows made by the first scale
  let flow = null;  // {segments: [{start, end, kind, label}], ideas: [{n, t, title, star}], duration}

  function setFlow(raw, duration, ideas) {
    flow = null;
    if (Array.isArray(raw) && raw.length && duration) {
      const list = raw.map(x => {
        const kind = OLD_KINDS[x.kind] || x.kind;
        return {start: seconds(x.start), kind: kind in FLOW_KINDS ? kind : "frame", label: x.label || ""};
      }).sort((a, b) => a.start - b.start);
      list.forEach((x, i) => { x.end = i + 1 < list.length ? list[i + 1].start : duration; });
      flow = {segments: list.filter(x => x.end > x.start), duration,
              ideas: (ideas || []).map((idea, i) => ({n: i + 1, t: seconds(idea.start), title: idea.title, star: Boolean(idea.highlight)}))};
    }
    renderFlowPanel();
    renderFlowMini();
  }
  const flowView = () => { try { return localStorage.getItem("yt-summary-flow-view") === "strip" ? "strip" : "curve"; } catch (e) { return "curve"; } };
  const kindColor = kind => `var(--flow-${kind})`;
  const kindClass = kind => kind === "silence" ? " hatch" : "";
  const kindName = kind => label(`flow_kind_${kind}`);
  const segmentAt = t => flow.segments.find(x => t >= x.start && t < x.end) || flow.segments[flow.segments.length - 1];
  const pct = t => `${(t / flow.duration * 100).toFixed(3)}%`;

  function renderFlowPanel() {
    const panel = document.getElementById("flow-panel");
    if (!panel) return;
    if (!flow) {
      panel.innerHTML = `<div class="flow-top"><h2>${esc(label("flow"))}</h2></div>
        <div class="flow-missing"><p>${esc(label("flow_missing"))}</p>${shownVersion ? "" : `<div id="flow-job"></div>`}</div>`;
      showFlowJob();
      return;
    }
    const view = flowView();
    const used = Object.keys(FLOW_KINDS).filter(k => flow.segments.some(x => x.kind === k));
    panel.innerHTML = `
      <div class="flow-top"><h2>${esc(label("flow"))}</h2>
        <div class="flow-views" role="group">${["curve", "strip"].map(v =>
          `<button type="button" data-flow-view="${v}" aria-pressed="${v === view}">${esc(label("flow_" + v))}</button>`).join("")}</div></div>
      <div class="flow-chart" id="flow-chart" tabindex="0" role="slider" aria-label="${esc(label("flow"))}"
        aria-valuemin="0" aria-valuemax="${Math.round(flow.duration)}" aria-valuenow="0">
        ${[0, .25, .5, .75, 1].map(f => `<span class="tick" style="top:${f * 100}%">${hms(flow.duration * f)}</span>`).join("")}
        ${view === "curve" ? flowCurve() : ""}
        <div class="playhead"></div><div class="flow-tip"></div>
      </div>
      <ul class="flow-legend">${used.map(k => `<li><i class="${kindClass(k)}" style="background-color:${kindColor(k)}"></i>${esc(kindName(k))}</li>`).join("")}
        ${flow.ideas.length ? `<li><i class="dot"></i>${esc(label("flow_ideas"))}</li>` : ""}
        ${flow.ideas.some(i => i.star) ? `<li><i class="dot star"></i>${esc(label("highlight"))}</li>` : ""}</ul>`;
    // The strip places its labels by the chart's real height, so it is drawn once the chart is on the page.
    const chart = document.getElementById("flow-chart");
    if (view === "strip") chart.insertAdjacentHTML("afterbegin", flowStrip(chart.clientHeight || 300));
    chart.insertAdjacentHTML("beforeend", ideaDots(view));
    movePlayhead(ready && player && player.getCurrentTime ? player.getCurrentTime() : null);
  }

  // The curve: a smooth line through the level of each segment; filler goes left of the axis, valuable talk right.
  // Each segment's band between the axis and its level has the color of its kind; framing is a thin band on the axis,
  // silence a pale one.
  function flowCurve() {
    const Y = t => t / flow.duration * 1000, X = kind => FLOW_KINDS[kind] / 4 * 92;
    let line = "";
    flow.segments.forEach((x, i) => {
      const y0 = Y(x.start), y1 = Y(x.end), cx = X(x.kind), r = Math.min((y1 - y0) * .3, 10);
      if (i === 0) line += `M${cx},0`;
      else {
        const px = X(flow.segments[i - 1].kind);
        line += ` C${px},${y0} ${cx},${y0} ${cx},${y0 + r}`;
      }
      line += ` L${cx},${y1 - (i + 1 < flow.segments.length ? Math.min((y1 - y0) * .3, 10) : 0)}`;
    });
    const bands = flow.segments.map(x => {
      const cx = X(x.kind), left = Math.min(cx, 0) || -4, right = Math.max(cx, 0) || 4;
      return `<rect x="${left}" y="${Y(x.start)}" width="${right - left}" height="${Y(x.end) - Y(x.start)}"
        style="fill:${kindColor(x.kind)}" fill-opacity="${x.kind === "silence" ? .5 : .8}"/>`;
    }).join("");
    return `<svg viewBox="-100 0 200 1000" preserveAspectRatio="none" aria-hidden="true">
        ${bands}
        <line x1="0" y1="0" x2="0" y2="1000" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
        <path d="${line}" fill="none" stroke="var(--text)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  // The main ideas as numbered dots: on the curve at the level of the talk at that time, on the strip on the bar.
  function ideaDots(view) {
    return flow.ideas.map(idea => {
      const left = view === "strip" ? "49px"
        : `calc(38px + (100% - 38px) * ${((FLOW_KINDS[segmentAt(idea.t).kind] / 4 * 92 + 100) / 200).toFixed(3)})`;
      return `<span class="idea-dot${idea.star ? " star" : ""}" style="top:${pct(idea.t)};left:${left}">${idea.star ? "★" : idea.n}</span>`;
    }).join("");
  }

  // The strip: one bar colored by the kind of each segment, with the labels of segments tall enough to read.
  function flowStrip(height) {
    let lastLabel = -100;
    return flow.segments.map(x => {
      const top = x.start / flow.duration * height, h = (x.end - x.start) / flow.duration * height;
      let text = "";
      if (top - lastLabel >= 14) {
        lastLabel = top;
        text = `<span class="flow-strip-label" style="top:${pct(x.start)}"><span class="k">${hms(x.start)}</span> ${esc(x.label)}</span>`;
      }
      return `<i class="flow-strip-seg${kindClass(x.kind)}" style="top:${pct(x.start)};height:${pct(x.end - x.start)};background-color:${kindColor(x.kind)}"
        title="${esc(kindName(x.kind))}"></i>${text}`;
    }).join("");
  }

  function renderFlowMini() {
    const mini = document.getElementById("flow-mini");
    if (!mini || !flow) return;
    mini.innerHTML = flow.segments.map(x => `<i class="${kindClass(x.kind)}" style="left:${pct(x.start)};width:${pct(x.end - x.start)};background-color:${kindColor(x.kind)}"
      title="${esc(`${hms(x.start)} · ${kindName(x.kind)} · ${x.label}`)}"></i>`).join("") + `<span class="playhead"></span>`;
  }

  function movePlayhead(now) {
    if (!flow || now === null || now === undefined) return;
    const head = document.querySelector("#flow-chart .playhead"), mini = document.querySelector("#flow-mini .playhead");
    if (head) { head.style.display = "block"; head.style.top = pct(now); }
    if (mini) { mini.style.display = "block"; mini.style.left = pct(now); }
    document.getElementById("flow-chart")?.setAttribute("aria-valuenow", String(Math.round(now)));
  }

  function seekFlow(t) {
    t = Math.max(0, Math.min(flow.duration - 1, t));
    if (ready && player) { player.seekTo(t, true); player.playVideo(); }
    else window.open(`https://www.youtube.com/watch?v=${videoId}&t=${Math.floor(t)}s`, "_blank", "noopener");
    movePlayhead(t);
    scrollToIdea(t);
  }
  const chartTime = (chart, clientY) => {
    const box = chart.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientY - box.top) / box.height)) * flow.duration;
  };
  document.addEventListener("click", e => {
    const viewButton = e.target.closest("[data-flow-view]");
    if (viewButton) {
      try { localStorage.setItem("yt-summary-flow-view", viewButton.dataset.flowView); } catch (err) {}
      renderFlowPanel();
      return;
    }
    if (!flow) return;
    const chart = e.target.closest("#flow-chart");
    if (chart) return seekFlow(chartTime(chart, e.clientY));
    const mini = e.target.closest("#flow-mini");
    if (mini) {
      const box = mini.getBoundingClientRect();
      seekFlow((e.clientX - box.left) / box.width * flow.duration);
    }
  });
  document.addEventListener("mousemove", e => {
    const chart = e.target.closest && e.target.closest("#flow-chart");
    const tip = document.querySelector("#flow-chart .flow-tip");
    if (!tip) return;
    if (!chart || !flow) { tip.style.display = "none"; return; }
    const t = chartTime(chart, e.clientY), x = segmentAt(t), box = chart.getBoundingClientRect();
    const near = flow.ideas.find(i => Math.abs(i.t - t) / flow.duration * box.height <= 8);
    tip.innerHTML = `<b>${hms(t)}</b> · ${esc(kindName(x.kind))}<br>${esc(x.label)}`
      + (near ? `<br>${near.star ? "★" : near.n}. ${esc(near.title)}` : "");
    tip.style.display = "block";
    const y = e.clientY - box.top;
    tip.style.top = `${y > box.height - 60 ? y - tip.offsetHeight - 10 : y + 14}px`;
  });
  // Keyboard on the chart: up and down jump to the previous or next segment.
  document.addEventListener("keydown", e => {
    if (!flow || e.target.id !== "flow-chart" || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    e.preventDefault();
    const now = Number(e.target.getAttribute("aria-valuenow")) || 0, current = segmentAt(now);
    const i = flow.segments.indexOf(current);
    const next = e.key === "ArrowDown" ? flow.segments[Math.min(i + 1, flow.segments.length - 1)]
      : flow.segments[now - current.start > 3 ? i : Math.max(i - 1, 0)];
    seekFlow(next.start);
  });

  // The flow of a summary made before flows existed: created on request, the same way as a summary.
  function showFlowJob() {
    const box = document.getElementById("flow-job");
    if (!box) return;
    const job = jobs[videoId] && jobs[videoId].mode === "flow" ? jobs[videoId] : null;
    if (job && job.state === "queued") box.innerHTML = `<p class="job"><span class="spinner"></span>${esc(label("flow_job_queued"))}</p>`;
    else if (job && job.state === "running") box.innerHTML = `<p class="job"><span class="spinner"></span>${esc(label("flow_job_running"))}</p>`;
    else box.innerHTML = (job && job.state === "error" ? `<p class="job error">${esc(label("flow_job_error", {error: job.error}))}</p>` : "")
      + (CONFIG.summarize ? `<button type="button" class="action" data-mode="flow" data-summarize="${esc(videoId)}">${esc(label("flow_create"))}</button>` : "");
  }
  window.addEventListener("resize", () => { if (flow && flowView() === "strip") renderFlowPanel(); });

  // Copy buttons: put their text on the clipboard and confirm it on the button for a moment.
  document.addEventListener("click", async e => {
    const button = e.target.closest("button[data-copy]");
    if (!button) return;
    const text = button.dataset.copy;
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {  // older browsers or a denied permission
      const area = Object.assign(document.createElement("textarea"), {value: text});
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    button.textContent = label("copied");
    setTimeout(() => { button.textContent = label("copy"); }, 1500);
  });

  // Highlight the topic and idea being played.
  function mark(selector, getTime, now) {
    const items = [...document.querySelectorAll(selector)].map(el => [getTime(el), el]).sort((a, b) => a[0] - b[0]);
    let current = null;
    for (const [t, el] of items) if (t <= now) current = el;
    items.forEach(([, el]) => el.classList.toggle("active", el === current));
  }
  setInterval(() => {
    if (!ready || !player || typeof player.getCurrentTime !== "function") return;
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    const now = player.getCurrentTime();
    mark("ul.topics li", li => Number(li.querySelector("a.t").dataset.t), now);
    const toc = document.querySelector("#toc .toc-topics"), active = toc && toc.querySelector("li.active");
    if (active && toc.scrollHeight > toc.clientHeight) {
      const a = active.getBoundingClientRect(), box = toc.getBoundingClientRect();
      if (a.top < box.top || a.bottom > box.bottom) toc.scrollTop += a.top - box.top - box.height / 3;
    }
    mark(".idea", el => Number(el.dataset.t), now);
    movePlayhead(now);
  }, 1000);

  // ---------- start ----------
  getJson("/api/config").then(async config => {
    L = config.labels;
    CONFIG = config;
    try { jobs = await getJson("/api/jobs"); } catch (e) {}
    refreshJobs();
    if (config.add) refreshDownloads();
    document.documentElement.lang = config.ui_language;
    route();
  });
</script>
</body>
</html>
