<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube archive</title>
<meta name="yt-token" content="{{TOKEN}}">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #e2e2e0;
    --accent: #c4302b; --accent-soft: #fbe9e8; --active: #e6effb;
    --star: #e2a400; --star-text: #1d1d1f; --star-soft: #fbf1d2; --star-strong: #8a5f00;
    --scroll-thumb: #c4c4c8; color-scheme: light;
    --flow-silence: #c9c9ce; --flow-promo: #d64545; --flow-smalltalk: #e8833a; --flow-tangent: #d9a520;
    --flow-frame: #a3a3aa; --flow-context: #86c5bd; --flow-loose: #a9bfd6; --flow-solid: #3b7dd8; --flow-dense: #6a3fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --surface: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --border: #2e2e33;
      --accent: #ff6b63; --accent-soft: #3a1f1e; --active: #1c2738;
      --star: #f2c14e; --star-text: #1d1d1f; --star-soft: #352c14; --star-strong: #f2c14e;
      --scroll-thumb: #3d3d44; color-scheme: dark;
      --flow-silence: #4a4a52; --flow-promo: #ff6b63; --flow-smalltalk: #ff9a52; --flow-tangent: #f0c14b;
      --flow-frame: #7d7d86; --flow-context: #6fb3ab; --flow-loose: #8aa0b4; --flow-solid: #5b94e6; --flow-dense: #a07af5;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121214; --surface: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --border: #2e2e33;
    --accent: #ff6b63; --accent-soft: #3a1f1e; --active: #1c2738;
    --star: #f2c14e; --star-text: #1d1d1f; --star-soft: #352c14; --star-strong: #f2c14e;
    --scroll-thumb: #3d3d44; color-scheme: dark;
    --flow-silence: #4a4a52; --flow-promo: #ff6b63; --flow-smalltalk: #ff9a52; --flow-tangent: #f0c14b;
    --flow-frame: #7d7d86; --flow-context: #6fb3ab; --flow-loose: #8aa0b4; --flow-solid: #5b94e6; --flow-dense: #a07af5;
  }
  * { box-sizing: border-box; }
  /* Thin scroll bars in the colors of the theme: only the thumb, without a track, border or arrows. */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-button { display: none; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; } }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 64px; }
  /* The window itself never scrolls: the page fills it, and only one part of it scrolls (.scroller): the list of
     channels or videos, or on a video page the open tab. */
  html, body { height: 100%; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-bottom: 0; }
  #app > :not(.scroller):not(.video-layout) { flex: none; }  /* the bars and headers keep their height */
  /* The scroller is exactly as high as the blocks it shows, so its scroll bar never reaches above or below them. */
  .scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 16px 0 16px;
    margin-right: -12px; padding-right: 6px; }  /* the scroll bar just right of the content, in the page's margin */
  .scroller > :first-child { margin-top: 0; }
  .scroller > :last-child { margin-bottom: 0; }
  a { color: inherit; }

  header.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 20px 0 12px; }
  h1 { font-size: 1.45rem; line-height: 1.3; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: .9rem; }
  .back { display: inline-block; color: var(--muted); font-size: .9rem; text-decoration: none; margin-bottom: 4px; }
  .back:hover { color: var(--accent); }
  .gear { flex-shrink: 0; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; padding: 0; }
  .gear:hover, .gear[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .gear svg { width: 20px; height: 20px; }
  .settings { position: fixed; z-index: 20; top: 64px; right: max(16px, calc((100vw - 920px) / 2 + 16px));
    width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 80px); overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .18); }
  .settings[hidden] { display: none; }
  .settings h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 8px; }
  .settings > h3:first-child { margin-top: 0; }
  .settings .theme { width: fit-content; }
  .settings label { display: block; font-size: .9rem; margin: 10px 0 4px; }
  .settings select#ui-language { margin-bottom: 0; }
  .settings label.check { display: flex; gap: 8px; align-items: center; }
  .settings input:not([type="checkbox"]), .settings select { width: 100%; box-sizing: border-box; font: inherit; font-size: .95rem;
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .settings input[aria-invalid="true"] { border-color: var(--accent); }
  .settings .note { color: var(--muted); font-size: .8rem; margin: 4px 0 0; line-height: 1.4; }
  .settings .field-error { color: var(--accent); font-size: .82rem; margin: 4px 0 0; }
  .settings .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .settings .actions button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 7px 16px; cursor: pointer;
    background: var(--accent); color: #fff; }
  .settings .actions button:disabled { opacity: .6; cursor: default; }
  .settings .status { font-size: .88rem; color: var(--muted); }
  .settings .status.error { color: var(--accent); }
  .settings .file { color: var(--muted); font-size: .75rem; margin: 10px 0 0; overflow-wrap: anywhere; }
  .theme { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .theme button { background: var(--surface); color: var(--muted); border: 0; padding: 6px 10px; font: inherit;
    font-size: .8rem; cursor: pointer; }
  .theme button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* Video page: a thin bar and the player stay at the top from the start, so nothing above them scrolls away
     and the player never moves; the title and details follow below the video. On a wide screen the topics stay
     in a column on the right; on a narrow one they open from a button in the bar. */
  .wrap.wide { max-width: 1480px; }
  .bar { position: sticky; top: 0; z-index: 6; background: var(--bg); height: var(--bar); box-sizing: border-box;
    display: flex; align-items: center; gap: 10px; }
  :root { --bar: 52px; }
  .bar .back, .bar .crumbs { margin: 0 auto 0 0; }
  /* On a video page: back to the archive, or to the video's channel. */
  .crumbs { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .crumbs .back { margin: 0; }
  .crumbs .back + .back { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  .crumbs .sep { color: var(--muted); font-size: .9rem; }
  .bar .gear { width: 34px; height: 34px; }
  .toc-toggle { display: none; font: inherit; font-size: .9rem; font-weight: 600; height: 34px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .toc-toggle:hover, .toc-toggle[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .video-layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 420px); gap: 24px; align-items: start; }
  .video-layout.no-toc { grid-template-columns: minmax(0, 1fr); }
  .video-layout { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .video-layout > .main { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .pinned, header.video-head, .tabs { flex: none; }
  .player { padding: 0 0 8px; }
  header.video-head { padding: 8px 0 4px; }
  /* The title with the regenerate button: the main part regenerates at once, the arrow opens the choices. */
  .title-row { display: flex; gap: 8px 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .title-row h1 { flex: 1 1 320px; }
  #regen { flex: none; margin-top: 6px; max-width: 100%; }
  #regen .job { font-size: .88rem; margin: 0; }
  #regen .job.error { max-width: 420px; font-size: .82rem; margin-top: 6px; }
  .head-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .version-pick select { font: inherit; font-size: .85rem; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); max-width: 260px; }
  .old-version { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; padding: 10px 14px;
    border-radius: 10px; background: var(--star-soft); border: 1px solid var(--star); }
  .old-version p { margin: 0; flex: 1 1 260px; }
  .old-version a { font-weight: 600; color: var(--accent); }
  .split { display: inline-flex; }
  .split button { font: inherit; font-size: .85rem; font-weight: 600; padding: 5px 12px; cursor: pointer; background: var(--surface);
    color: var(--accent); border: 1px solid var(--accent); }
  .split button:first-child { border-radius: 8px 0 0 8px; }
  .split button:last-child { border-radius: 0 8px 8px 0; border-left: 0; padding: 5px 8px; }
  .split button:hover { background: var(--accent-soft); }
  .split button:disabled { opacity: .6; cursor: default; }
  dialog.add.regen { width: min(520px, calc(100vw - 24px)); }
  .regen-form fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  .regen-form legend, .regen-form > label { display: block; font-size: .92rem; font-weight: 600; margin-bottom: 6px; }
  .regen-form label.check { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; }
  .regen-form label.check .note { display: block; margin: 0; }
  .regen-form select { font: inherit; font-size: .95rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); margin-bottom: 14px; }
  aside.toc { max-height: 100%; padding: 14px 0 16px; display: flex;
    flex-direction: column; gap: 12px; box-sizing: border-box; }
  aside.toc > .toc-topics { flex: 1 1 auto; min-height: 140px; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; }
  /* With the flow, the column takes the whole height of the window: the topics at most half (less when they are
     few), the flow the rest, its chart stretching with it. */
  aside.toc.with-flow { height: 100%; }
  aside.toc.with-flow > .toc-topics { flex: 0 1 auto; max-height: 50%; }
  aside.toc.with-flow > .flow-panel { flex: 1 1 auto; min-height: 260px; display: flex; flex-direction: column; }
  aside.toc.with-flow .flow-chart { flex: 1 1 auto; height: auto; min-height: 160px; }
  /* Flow of the video: the whole length top to bottom, filler left of the axis, valuable talk right of it. */
  .flow-panel { flex: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin: 0; }
  .flow-panel .flow-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .flow-panel h2 { font-size: 1rem; margin: 0; }
  .flow-views { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .flow-views button { font: inherit; font-size: .78rem; border: 0; background: var(--surface); color: var(--muted);
    padding: 3px 9px; cursor: pointer; }
  .flow-views button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .flow-chart { position: relative; height: 300px; cursor: crosshair; outline: none;
    border-radius: 6px; user-select: none; }
  .flow-chart:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .flow-chart svg { position: absolute; inset: 0 0 0 38px; width: calc(100% - 38px); height: 100%; overflow: visible; }
  .flow-chart .tick { position: absolute; left: 0; width: 34px; text-align: right; font-size: .68rem; color: var(--muted);
    transform: translateY(-50%); font-variant-numeric: tabular-nums; pointer-events: none; }
  .flow-chart .playhead { position: absolute; left: 34px; right: 0; height: 0; border-top: 2px solid var(--text);
    pointer-events: none; display: none; }
  .flow-chart .playhead::before { content: ""; position: absolute; left: -2px; top: -5px; border: 4px solid transparent;
    border-left: 6px solid var(--text); }
  /* The main ideas on the flow: numbered dots at their times; the important ones with a gold star. */
  .flow-chart .idea-dot { position: absolute; transform: translate(-50%, -50%); min-width: 15px; height: 15px; padding: 0 2px;
    box-sizing: border-box; border-radius: 8px; background: var(--surface); color: var(--text); border: 1.5px solid var(--text);
    font-size: .6rem; font-weight: 700; line-height: 12px; text-align: center; pointer-events: none; }
  .flow-chart .idea-dot.star { background: var(--star); border-color: var(--star-text); color: var(--star-text); }
  .hatch { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(127, 127, 127, .35) 3px 5px); }
  .highlight { display: flex; gap: 8px; align-items: baseline; margin: 2px 0 8px; padding: 6px 10px; border-radius: 8px;
    background: var(--star-soft); font-size: .92rem; }
  .highlight b { color: var(--star-strong); white-space: nowrap; }
  .flow-strip-seg { position: absolute; left: 38px; width: 22px; box-sizing: border-box; border-bottom: 1px solid var(--surface); }
  .flow-strip-label { position: absolute; left: 68px; right: 0; font-size: .74rem; line-height: 1.25; color: var(--text);
    transform: translateY(-1px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; }
  .flow-strip-label .k { color: var(--muted); }
  .flow-tip { position: absolute; z-index: 3; left: 40px; right: 0; pointer-events: none; display: none;
    background: var(--text); color: var(--bg); font-size: .78rem; line-height: 1.35; border-radius: 6px; padding: 4px 8px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .2); }
  .flow-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin: 10px 0 0; padding: 0; list-style: none;
    font-size: .72rem; color: var(--muted); }
  .flow-legend li { display: flex; align-items: center; gap: 6px; }
  .flow-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .flow-legend i.dot { border-radius: 50%; border: 1.5px solid var(--text); box-sizing: border-box; background: var(--surface); }
  .flow-legend i.dot.star { background: var(--star); border-color: var(--star-text); }
  .flow-missing p { font-size: .88rem; color: var(--muted); margin: 0 0 8px; }
  .flow-missing button.action { margin: 0; padding: 6px 12px; font-size: .88rem; }
  /* Narrow screens: a thin strip under the player instead of the panel. */
  .flow-mini { display: none; position: relative; height: 10px; margin: 0 auto 8px; border-radius: 5px; overflow: hidden;
    cursor: pointer; width: min(100%, calc(42vh * 16 / 9)); }
  .flow-mini > i { position: absolute; top: 0; bottom: 0; }
  .flow-mini .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); display: none;
    box-shadow: 0 0 0 1px var(--bg); }
  aside.toc h2 { font-size: 1rem; margin: 0 0 6px; }
  aside.toc ul.topics { columns: auto; }
  aside.toc ul.topics li { cursor: pointer; border-radius: 6px; padding: 4px 6px; margin: 0 -6px; line-height: 1.4; }
  aside.toc ul.topics li:hover { background: var(--accent-soft); }
  aside.toc ul.topics li.active { background: var(--active); }
  aside.toc ul.topics li span { font-size: .92rem; }
  /* Tabs under the video: the overview with the description, and the main ideas; only their content scrolls. */
  .tabs { background: var(--bg); display: flex; gap: 4px;
    border-bottom: 1px solid var(--border); margin-top: 8px; }
  .tabs button { font: inherit; font-weight: 600; font-size: .95rem; background: none; border: 0; color: var(--muted);
    padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .count { font-weight: 400; color: var(--muted); }
  [role="tabpanel"][hidden] { display: none; }
  @media (max-width: 1099px) {
    .video-layout { grid-template-columns: minmax(0, 1fr); }
    .toc-toggle { display: block; }
    aside.toc { display: none; position: fixed; z-index: 15; top: var(--bar); right: 16px; padding: 0; width: min(360px, calc(100vw - 32px));
      max-height: 65vh; box-shadow: 0 12px 32px rgba(0, 0, 0, .18); border-radius: 12px; }
    aside.toc.open { display: flex; }
    aside.toc.with-flow { height: auto; }
    aside.toc.with-flow > .toc-topics { max-height: none; }
    aside.toc .flow-panel, aside.toc.with-flow > .flow-panel { display: none; }
    .flow-mini { display: block; }
  }
  .frame { width: min(100%, calc(42vh * 16 / 9)); margin: 0 auto; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; overflow: hidden; }
  .frame iframe, .frame #player { width: 100%; height: 100%; border: 0; display: block; }
  .frame a.poster { display: block; width: 100%; height: 100%; background-size: cover; background-position: center;
    position: relative; }
  .frame a.poster::after { content: "▶"; position: absolute; inset: 0; margin: auto; width: 72px; height: 50px;
    border-radius: 12px; background: var(--accent); color: #fff; font-size: 24px; display: grid; place-items: center; }
  .fallback { display: none; color: var(--muted); font-size: .85rem; text-align: center; margin: 6px 0 0; }
  .no-player .fallback { display: block; }

  section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
    margin-top: 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  h2 a, ul.topics a[data-nav] { text-decoration: none; }
  h2 a:hover, ul.topics a[data-nav]:hover { color: var(--accent); }
  h3 { font-size: 1.02rem; margin: 0 0 6px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  p { margin: 0 0 8px; }
  .notice { background: var(--accent-soft); border-color: transparent; }
  .command { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .command code { font: .95rem ui-monospace, Consolas, monospace; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; }
  .command button { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 6px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; }
  .command button:hover { filter: brightness(1.1); }
  button.action { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; margin: 4px 0 12px; }
  button.action:hover { filter: brightness(1.1); }
  button.action:disabled { opacity: .6; cursor: default; }
  button.action.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
  .list-actions button.action { padding: 5px 12px; font-size: .85rem; margin: 8px 0 4px; }
  .job { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .job.error { color: var(--accent); font-weight: 400; overflow-wrap: anywhere; }
  .badge.working { color: var(--muted); background: var(--border); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  a.t { font-variant-numeric: tabular-nums; font-size: .82rem; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; text-decoration: none; white-space: nowrap; }
  a.t::before { content: "▶ "; font-size: .7rem; }
  a.t:hover { filter: brightness(1.1); text-decoration: underline; }

  ul.topics { list-style: none; padding: 0; margin: 0; columns: 2 280px; column-gap: 24px; }
  ul.topics li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; break-inside: avoid; }
  ul.topics li.active span { font-weight: 600; }

  .idea { padding: 14px 0; border-top: 1px solid var(--border); border-radius: 8px; transition: background .3s; }
  .idea:first-of-type { border-top: 0; padding-top: 0; }
  .idea.active { background: var(--active); box-shadow: 0 0 0 8px var(--active); }
  .n { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%;
    background: var(--text); color: var(--bg); font-size: .78rem; }
  ul.moments { margin: 0; padding-left: 0; list-style: none; }
  /* Ideas: every time in one column on the left, the title and quotes next to it. */
  .idea h3 { display: grid; grid-template-columns: var(--time-col) auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
  ul.moments li { padding: 2px 0; display: grid; grid-template-columns: var(--time-col) minmax(0, 1fr); gap: 10px;
    align-items: baseline; }
  .idea a.t { justify-self: start; }
  :root { --time-col: 4.8em; }
  @media (max-width: 600px) { :root { --time-col: 4.3em; } .idea h3 { gap: 8px; } }
  details summary { cursor: pointer; font-weight: 600; }
  .description { white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0 0; font-size: .92rem; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 20px; text-align: center; }

  .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 4px 0 8px; }
  .filters input[type="search"] { flex: 1 1 240px; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .filters label { color: var(--muted); font-size: .9rem; display: flex; gap: 6px; align-items: center; }
  ul.videos { list-style: none; padding: 0; margin: 0; }
  ul.videos li + li { border-top: 1px solid var(--border); }
  ul.videos a { display: flex; gap: 12px; align-items: center; padding: 8px 0; text-decoration: none; }
  ul.videos a:hover .title { color: var(--accent); }
  ul.videos img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; flex-shrink: 0;
    background: var(--border); }
  ul.videos .title { display: block; font-weight: 600; line-height: 1.35; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    border-radius: 6px; padding: 0 6px; margin-left: 6px; }
  .empty { color: var(--muted); }

  ul.channels { list-style: none; padding: 0; margin: 0; }
  ul.channels li + li { border-top: 1px solid var(--border); }
  ul.channels a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 4px;
    text-decoration: none; border-radius: 8px; }
  ul.channels .info { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  ul.channels a:hover { background: var(--accent-soft); }
  ul.channels a:hover .name { color: var(--accent); }
  ul.channels .name { font-weight: 600; font-size: 1.05rem; }
  ul.channels .badge { margin-left: 0; }
  ul.channels .chevron { color: var(--muted); font-size: 1.2rem; line-height: 1; }
  section > h2 .meta { font-weight: 400; }

  /* Adding videos: a dialog with links or a YouTube search, the overview, and the downloads in progress. */
  .top-buttons { display: flex; gap: 8px; flex-shrink: 0; }
  .add-button.busy { position: relative; color: var(--accent); }
  .add-button.busy::after { content: ""; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px var(--bg); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  dialog.add { width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--border);
    border-radius: 14px; background: var(--bg); color: var(--text); box-shadow: 0 20px 48px rgba(0, 0, 0, .3); }
  dialog.add[open] { display: flex; flex-direction: column; }
  dialog.add::backdrop { background: rgba(0, 0, 0, .45); }
  .add-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border); }
  .add-head h2 { margin: 0; font-size: 1.1rem; }
  .add-close { font-size: 1.6rem; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .add-close:hover { color: var(--accent); }
  .add-body { padding: 14px 18px; overflow-y: auto; flex: 1 1 auto; }
  .add-body > form label { display: block; font-size: .92rem; color: var(--muted); margin-bottom: 6px; }
  .add-body textarea { width: 100%; font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 8px; resize: vertical;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .add-body .note { color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
  .add-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .add-actions .action { margin: 8px 0 0; }
  .add-foot { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 10px 18px;
    border-top: 1px solid var(--border); }
  .add-foot .action { margin: 0; padding: 6px 14px; }
  .add-foot .grow { flex: 1 1 auto; }
  .add-foot label.check { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  .add-foot .note { display: block; font-size: .78rem; color: var(--muted); }
  .add-wait { display: flex; align-items: center; flex-wrap: wrap; color: var(--muted); margin: 0; }
  .add-wait .meta { flex-basis: 100%; overflow-wrap: anywhere; }
  section.add-card { margin: 0 0 12px; padding: 14px 16px; }
  section.add-card h3 { margin: 2px 0 4px; }
  .add-kind { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .add-card .done { color: var(--muted); font-weight: 600; margin: 8px 0 0; }
  table.add-table { border-collapse: collapse; margin: 8px 0; font-size: .9rem; font-variant-numeric: tabular-nums; }
  table.add-table th, table.add-table td { padding: 2px 16px 2px 0; text-align: right; }
  table.add-table th:first-child, table.add-table td:first-child { text-align: left; }
  table.add-table th { font-weight: 600; color: var(--muted); font-size: .8rem; }
  table.add-table tr.total td { border-top: 1px solid var(--border); font-weight: 600; }
  table.add-table tr.off td { color: var(--muted); }
  .add-filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: .88rem; margin: 8px 0; }
  .add-filters label { display: flex; gap: 5px; align-items: center; }
  .add-filters input[type="date"] { font: inherit; font-size: .88rem; padding: 2px 6px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--text); }
  .add-filters button { font: inherit; font-size: .82rem; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--accent);
    background: none; color: var(--accent); cursor: pointer; }
  .add-notes { list-style: none; padding: 0; margin: 6px 0; font-size: .85rem; color: var(--muted); }
  .add-sample { margin: 4px 0 6px; padding-left: 22px; font-size: .88rem; }
  .add-card h4 { margin: 10px 0 2px; }
  ul.add-results { list-style: none; padding: 0; margin: 0; }
  ul.add-results li + li { border-top: 1px solid var(--border); }
  ul.add-results label { display: grid; grid-template-columns: auto 112px minmax(0, 1fr); gap: 10px; align-items: center;
    padding: 8px 0; cursor: pointer; }
  ul.add-results label.off { cursor: default; }
  ul.add-results label.off img, ul.add-results label.off .title { opacity: .6; }
  ul.add-results img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--border); }
  ul.add-results .title { display: block; font-weight: 600; line-height: 1.35; text-decoration: none; }
  ul.add-results .title:hover { color: var(--accent); text-decoration: underline; }
  ul.add-results .badge { margin-left: 0; }
  #add-downloads:not(:empty) { padding: 10px 18px 14px; border-top: 1px solid var(--border); max-height: 30vh; overflow-y: auto; }
  #add-downloads h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; }
  #add-downloads ul { list-style: none; padding: 0; margin: 0; }
  #add-downloads li { padding: 4px 0; font-size: .9rem; min-width: 0; }
  #add-downloads li > b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #add-downloads .meta { display: flex; align-items: center; min-width: 0; }
  #add-downloads .last { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #add-downloads .error { color: var(--accent); overflow-wrap: anywhere; }
  @media (max-width: 600px) {
    ul.add-results label { grid-template-columns: auto 80px minmax(0, 1fr); }
    ul.add-results img { width: 80px; }
    .add-body, .add-head, .add-foot { padding-left: 14px; padding-right: 14px; }
  }

  @media (max-width: 600px) {
    .settings { top: 60px; }
    section { padding: 14px; }
    ul.videos img { width: 88px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="settings" id="settings" role="dialog" hidden></div>
<dialog class="add" id="add-dialog"></dialog>
<dialog class="add regen" id="regen-dialog"></dialog>

<script>
  const app = document.getElementById("app");
  let L = {};          // labels in the summary language, from /api/config
  let CONFIG = {};     // the rest of /api/config: language, model, whether summaries can be started here
  let videos = null;   // archive list, loaded once per visit of the home page
  let pageKind = "archive";
  const TOKEN = document.querySelector('meta[name="yt-token"]').content;
  let player = null, ready = false, playerTimer = null;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const label = (key, values = {}) => (L[key] || key).replace(/\{(\w+)\}/g, (_, k) => values[k] ?? "");
  const getJson = url => fetch(url).then(r => r.json());

  function hms(s) {
    s = Math.floor(s || 0);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
  }
  function seconds(v) {
    if (typeof v === "number") return Math.floor(v);
    return String(v).split(":").reduce((total, part) => total * 60 + Number(part), 0);
  }
  const day = d => d && d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}` : (d || "");
  const paragraphs = text => String(text || "").split(/\n\n+/).filter(p => p.trim()).map(p => `<p>${esc(p.trim())}</p>`).join("");

  // ---------- theme: auto follows the system; a choice is remembered in this browser only ----------
  function currentTheme() { try { return localStorage.getItem("yt-summary-theme") || "auto"; } catch (e) { return "auto"; } }
  function applyTheme(choice) {
    if (choice === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", choice);
    document.querySelectorAll("[data-theme-choice]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice)));
  }
  const themeSwitch = () => `<div class="theme" role="group">${["auto", "light", "dark"].map(c =>
    `<button data-theme-choice="${c}">${esc(label("theme_" + c))}</button>`).join("")}</div>`;
  const GEAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
  const settingsButton = () => `<button class="gear" data-settings aria-haspopup="dialog" aria-expanded="false"
    aria-label="${esc(label("settings"))}" title="${esc(label("settings"))}">${GEAR}</button>`;

  // ---------- settings: the theme (this browser) and the shared config file ----------
  const settingsPanel = document.getElementById("settings");
  function closeSettings() {
    settingsPanel.hidden = true;
    document.querySelectorAll("[data-settings]").forEach(b => b.setAttribute("aria-expanded", "false"));
  }
  // A language in its own name ("English", "Deutsch"), so it can be found whatever the page language is.
  function languageName(code) {
    try {
      const name = new Intl.DisplayNames([code], {type: "language"}).of(code);
      return name && name !== code ? `${name[0].toLocaleUpperCase(code)}${name.slice(1)}` : code;
    } catch (e) { return code; }
  }
  async function openSettings() {
    let data;
    try { data = await getJson("/api/settings"); } catch (e) { return; }
    const sm = data.summary, f = data.fetch;
    const models = data.models.includes(sm.model) ? data.models : [...data.models, sm.model];
    const field = (name, title, input, note = "") => `<div data-field="${name}"><label for="s-${name}">${esc(title)}</label>${input}
      ${note ? `<p class="note">${esc(note)}</p>` : ""}<p class="field-error" hidden></p></div>`;
    settingsPanel.setAttribute("aria-label", label("settings"));
    settingsPanel.innerHTML = `
      <h3>${esc(label("settings_appearance"))}</h3>
      <label for="ui-language">${esc(label("settings_ui_language"))}</label>
      <select id="ui-language">${data.ui_languages.map(code =>
        `<option value="${esc(code)}"${code === data.ui_language ? " selected" : ""}>${esc(languageName(code))}</option>`).join("")}</select>
      <p class="note">${esc(label("settings_ui_language_note"))}</p><p class="field-error" id="ui-language-error" hidden></p>
      <label>${esc(label("settings_theme"))}</label>${themeSwitch()}<p class="note">${esc(label("settings_theme_note"))}</p>
      <form id="settings-form" novalidate>
        <h3>${esc(label("settings_summary"))}</h3>
        ${field("summary.language", label("settings_language"),
          `<input id="s-summary.language" value="${esc(sm.language)}" autocomplete="off" spellcheck="false">`, label("settings_language_note"))}
        ${field("summary.model", label("settings_model"), `<select id="s-summary.model">${models.map(m =>
          `<option value="${esc(m)}"${m === sm.model ? " selected" : ""}>${esc(m === "inherit" ? label("settings_model_inherit") : m[0].toUpperCase() + m.slice(1))}</option>`).join("")}</select>`)}
        ${field("summary.parallel", label("settings_parallel"),
          `<input id="s-summary.parallel" type="number" min="1" max="10" value="${esc(sm.parallel)}">`)}
        <h3>${esc(label("settings_server"))}</h3>
        ${field("summary.port", label("settings_port"),
          `<input id="s-summary.port" type="number" min="1024" max="65535" value="${esc(sm.port)}">`, label("settings_port_note"))}
        <h3>${esc(label("settings_archive"))}</h3>
        ${field("output_dir", label("settings_output_dir"),
          `<input id="s-output_dir" value="${esc(data.output_dir || "")}" autocomplete="off" spellcheck="false">`, label("settings_output_dir_note"))}
        ${field("fetch.caption_fallback_languages", label("settings_fallback"),
          `<input id="s-fetch.caption_fallback_languages" value="${esc((f.caption_fallback_languages || []).join(", "))}" autocomplete="off" spellcheck="false">`,
          label("settings_fallback_note"))}
        ${data.windows ? `<div data-field="fetch.explorer_names"><label class="check"><input type="checkbox" id="s-fetch.explorer_names"${f.explorer_names ? " checked" : ""}>
          ${esc(label("settings_explorer_names"))}</label><p class="field-error" hidden></p></div>` : ""}
        <div class="actions"><button type="submit">${esc(label("settings_save"))}</button><span class="status" role="status"></span></div>
        <p class="file">${esc(label("settings_file", {path: data.config}))}</p>
      </form>`;
    applyTheme(currentTheme());
    const gear = document.querySelector("[data-settings]");
    if (gear) {
      const r = gear.getBoundingClientRect();
      settingsPanel.style.top = `${Math.round(r.bottom + 8)}px`;
      settingsPanel.style.right = `${Math.max(16, Math.round(document.documentElement.clientWidth - r.right))}px`;
    }
    settingsPanel.hidden = false;
    document.querySelectorAll("[data-settings]").forEach(b => b.setAttribute("aria-expanded", "true"));
  }
  document.addEventListener("click", e => {
    if (e.target.closest("[data-settings]")) {
      settingsPanel.hidden ? openSettings() : closeSettings();
    } else if (!settingsPanel.hidden && !settingsPanel.contains(e.target)) {
      closeSettings();
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !settingsPanel.hidden) closeSettings(); });
  settingsPanel.addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target, value = name => form.querySelector(`[id="s-${name}"]`);
    const status = form.querySelector(".status"), button = form.querySelector("button[type=submit]");
    form.querySelectorAll(".field-error").forEach(el => { el.hidden = true; });
    form.querySelectorAll("[aria-invalid]").forEach(el => el.removeAttribute("aria-invalid"));
    status.className = "status"; status.textContent = "";
    const body = {
      output_dir: value("output_dir").value,
      summary: {language: value("summary.language").value, model: value("summary.model").value,
                parallel: value("summary.parallel").value, port: value("summary.port").value},
      fetch: {caption_fallback_languages: value("fetch.caption_fallback_languages").value},
    };
    if (value("fetch.explorer_names")) body.fetch.explorer_names = value("fetch.explorer_names").checked;
    button.disabled = true;
    try {
      const response = await fetch("/api/settings", {method: "POST",
        headers: {"Content-Type": "application/json", "X-Token": TOKEN}, body: JSON.stringify(body)});
      const result = response.headers.get("Content-Type")?.includes("json") ? await response.json() : {};
      if (response.status === 400 && result.field) {
        const box = form.querySelector(`[data-field="${result.field}"]`);
        const message = box.querySelector(".field-error");
        message.textContent = label(result.error); message.hidden = false;
        box.querySelector("input, select")?.setAttribute("aria-invalid", "true");
        box.querySelector("input, select")?.focus();
        return;
      }
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      if (result.restart) {
        const port = result.settings.summary.port;
        status.textContent = label("settings_moving", {port});
        return moveToPort(port, status);
      }
      if (!result.saved.length) { status.textContent = label("settings_unchanged"); return; }
      // Language or archive folder: the page shows other data now. Otherwise only the labels and model are refreshed.
      if (result.saved.some(k => k === "summary.language" || k === "output_dir")) return location.reload();
      CONFIG = await getJson("/api/config"); L = CONFIG.labels;
      status.textContent = label("settings_saved");
    } catch (err) {
      status.className = "status error";
      status.textContent = label("settings_error", {error: err.message});
    } finally {
      button.disabled = false;
    }
  });
  // The page language is saved and applied at once: the page and this menu are drawn again in the new language,
  // keeping what was typed in the form and not saved yet.
  settingsPanel.addEventListener("change", async e => {
    if (e.target.id !== "ui-language") return;
    const select = e.target, error = document.getElementById("ui-language-error");
    const kept = [...settingsPanel.querySelectorAll("#settings-form [id^='s-']")]
      .map(el => [el.id, el.type === "checkbox" ? el.checked : el.value]);
    const panelScroll = settingsPanel.scrollTop;
    select.disabled = true; error.hidden = true;
    try {
      const response = await fetch("/api/settings", {method: "POST",
        headers: {"Content-Type": "application/json", "X-Token": TOKEN},
        body: JSON.stringify({summary: {ui_language: select.value}})});
      if (!response.ok) {
        const result = response.headers.get("Content-Type")?.includes("json") ? await response.json() : {};
        throw new Error(result.error ? label(result.error) : `HTTP ${response.status}`);
      }
      CONFIG = await getJson("/api/config"); L = CONFIG.labels;
      document.documentElement.lang = CONFIG.ui_language;
      history.replaceState({scroll: scrollPos()}, "");
      await route();
      await openSettings();
      kept.forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) el[el.type === "checkbox" ? "checked" : "value"] = value;
      });
      settingsPanel.scrollTop = panelScroll;
      document.getElementById("ui-language").focus({preventScroll: true});
    } catch (err) {
      select.disabled = false;
      error.textContent = label("settings_error", {error: err.message}); error.hidden = false;
    }
  });
  async function moveToPort(port, status) {
    const origin = `${location.protocol}//${location.hostname}:${port}`;
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 500));
      try {
        await fetch(`${origin}/api/health`, {mode: "no-cors", cache: "no-store"});
        location.href = origin + location.pathname;
        return;
      } catch (e) {}
    }
    status.className = "status error";
    status.textContent = label("settings_move_failed", {port});
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-theme-choice]");
    if (!b) return;
    applyTheme(b.dataset.themeChoice);
    try { localStorage.setItem("yt-summary-theme", b.dataset.themeChoice); } catch (err) {}
  });

  // ---------- routing: / is the archive, /c/<id> a channel, /p/<id> a playlist, /v/<id> one video ----------
  // Going back returns to the place on the page where the user left it.
  history.scrollRestoration = "manual";
  // The one part of the page that scrolls: the list, or the open tab of a video.
  const scroller = () => document.querySelector(".scroller:not([hidden])");
  const scrollPos = () => scroller()?.scrollTop ?? 0;
  function setScroll(y) { const el = scroller(); if (el) el.scrollTop = y; }

  function route() {
    const match = location.pathname.match(/^\/([vcp])\/([\w-]+)$/);
    const scroll = (history.state && history.state.scroll) || 0;
    stopPlayer();
    closeSettings();
    app.classList.remove("wide");
    const page = !match ? showArchive({kind: "all"})
      : match[1] === "v" ? showVideo(match[2])
      : showArchive({kind: match[1] === "c" ? "channel" : "playlist", id: match[2]});
    return page.then(() => { applyTheme(currentTheme()); setScroll(scroll); });
  }
  document.addEventListener("click", e => {
    const link = e.target.closest("a[data-nav]");
    if (!link || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    history.replaceState({scroll: scrollPos()}, "");
    history.pushState(null, "", link.getAttribute("href"));
    route();
  });
  window.addEventListener("popstate", route);

  // ---------- archive (the channels, or search results across them), one channel or one playlist ----------
  // The search and the filter are part of the address (?q=…&summaries=1), so going back from a video returns to them.
  let filter = {text: "", onlySummaries: false};
  let scope = {kind: "all"}, playlists = [], scoped = [];

  // Labels with a count: <key>_one, <key>_few, … by the plural rules of the page language, <key>_other as fallback.
  function plural(key, n) {
    let rule = "other";
    try { rule = new Intl.PluralRules(document.documentElement.lang || "en").select(n); } catch (e) {}
    return (L[`${key}_${rule}`] || L[`${key}_other`] || key).replace("{n}", n);
  }
  // Search ignores case and diacritics: "cafe" finds "Café".
  const plain = text => String(text || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  function readFilter() {
    const params = new URLSearchParams(location.search);
    filter = {text: params.get("q") || "", onlySummaries: params.get("summaries") === "1"};
  }
  function writeFilter() {
    const params = new URLSearchParams();
    if (filter.text.trim()) params.set("q", filter.text.trim());
    if (filter.onlySummaries) params.set("summaries", "1");
    const query = params.toString();
    history.replaceState(history.state, "", location.pathname + (query ? `?${query}` : ""));
  }

  async function showArchive(newScope) {
    scope = newScope;
    pageKind = "archive";
    readFilter();
    [videos, playlists] = await Promise.all([getJson("/api/videos"), getJson("/api/playlists")]);
    let title = label("archive");
    if (scope.kind === "channel") {
      scoped = videos.filter(v => v.channel_id === scope.id);
      title = scoped.length ? scoped[0].channel : null;
    } else if (scope.kind === "playlist") {
      const playlist = playlists.find(p => p.id === scope.id);
      const byId = new Map(videos.map(v => [v.id, v]));
      scoped = playlist ? playlist.videos.filter(id => byId.has(id)).map(id => byId.get(id)) : [];
      title = playlist ? playlist.title : null;
    } else {
      scoped = videos;
    }
    const back = scope.kind === "all" ? "" : `<a class="back" href="/" data-nav>← ${esc(label("back"))}</a>`;
    if (title === null) {
      document.title = label("list_not_found");
      app.innerHTML = `<header class="top"><div>${back}<h1>${esc(label("list_not_found"))}</h1></div>${topButtons()}</header>`;
      return;
    }
    document.title = title;
    const withSummary = scoped.filter(v => v.summary).length;
    app.innerHTML = `
      <header class="top">
        <div>${back}<h1>${esc(title)}</h1>
          <div class="meta">${esc(label("video_count", {n: scoped.length}))} · ${esc(label("summary_count", {n: withSummary}))}<span id="jobs-indicator"></span></div>
          ${scope.kind === "all" ? "" : `<div class="list-actions">${listButtons(scoped)}</div>`}</div>
        ${topButtons()}
      </header>
      <div class="filters">
        <input type="search" id="q" placeholder="${esc(label(scope.kind === "all" ? "search_all" : "search"))}" value="${esc(filter.text)}">
        <label><input type="checkbox" id="only" ${filter.onlySummaries ? "checked" : ""}> ${esc(label("only_summaries"))}</label>
      </div>
      <div id="list" class="scroller"></div>`;
    document.getElementById("q").addEventListener("input", e => { filter.text = e.target.value; writeFilter(); renderList(); });
    document.getElementById("only").addEventListener("change", e => { filter.onlySummaries = e.target.checked; writeFilter(); renderList(); });
    renderList();
    showJobsIndicator();
  }

  const videoList = (list, withChannel = false) => `<ul class="videos">${list.map(v => `
    <li><a href="/v/${esc(v.id)}" data-nav>
      <img src="/api/thumb/${esc(v.id)}" alt="" loading="lazy">
      <span><span class="title">${esc(v.title)}${v.summary ? `<span class="badge">${esc(label("summary_badge"))}</span>`
        : isActive(v.id) ? `<span class="badge working">${esc(label("badge_working"))}</span>` : ""}</span>
        <span class="meta">${withChannel ? `${esc(v.channel)} · ` : ""}${esc(day(v.upload_date))} · ${hms(v.duration)}</span></span>
    </a></li>`).join("")}
  </ul>`;

  // The channels of the archive, from the videos (a channel shows up once it has a video).
  function channelsOf(list) {
    const channels = new Map();
    for (const v of list) {
      if (!channels.has(v.channel_id)) channels.set(v.channel_id, {id: v.channel_id, name: v.channel, videos: []});
      channels.get(v.channel_id).videos.push(v);
    }
    return [...channels.values()].sort((a, b) => a.name.localeCompare(b.name));
  }
  const channelRows = channels => `<ul class="channels">${channels.map(c => {
    const summaries = c.videos.filter(v => v.summary).length;
    const newest = c.videos.reduce((max, v) => v.upload_date > max ? v.upload_date : max, "");
    return `<li><a href="/c/${esc(c.id)}" data-nav><span class="info">
      <span class="name">${esc(c.name)}</span>
      <span class="meta">${esc(plural("channel_videos", c.videos.length))}</span>
      ${summaries ? `<span class="badge">${esc(label("summary_badge"))} ${summaries}</span>` : ""}
      ${newest ? `<span class="meta">${esc(label("newest", {date: day(newest)}))}</span>` : ""}</span>
      <span class="chevron" aria-hidden="true">›</span></a></li>`;
  }).join("")}</ul>`;

  function renderList() {
    const words = plain(filter.text).split(/\s+/).filter(Boolean);
    const list = document.getElementById("list");
    const searching = words.length > 0 || filter.onlySummaries;
    let shown = scoped
      .filter(v => !filter.onlySummaries || v.summary)
      .filter(v => words.every(w => plain(v.title + " " + v.channel).includes(w)));

    // The archive without a search: the channels (each opens its own page) and the playlists.
    if (scope.kind === "all" && !searching) {
      list.innerHTML = `<section>${channelRows(channelsOf(videos))}</section>` + (playlists.length ? `
        <section><h2>${esc(label("playlists"))}</h2>
          <ul class="topics">${playlists.map(p => `<li><a href="/p/${esc(p.id)}" data-nav>${esc(p.title)}</a>
            <span class="meta">(${p.videos.length})</span></li>`).join("")}</ul>
        </section>` : "");
      return;
    }
    // The archive with a search: the channels whose name matches, then the matching videos of all channels, newest first.
    if (scope.kind === "all") {
      const channels = words.length ? channelsOf(videos.filter(v => !filter.onlySummaries || v.summary))
        .filter(c => words.every(w => plain(c.name).includes(w))) : [];
      shown = shown.slice().sort((a, b) => b.upload_date.localeCompare(a.upload_date));
      list.innerHTML = (channels.length ? `<section><h2>${esc(label("channels"))}</h2>${channelRows(channels)}</section>` : "")
        + (shown.length ? `<section><h2>${esc(label("videos"))} <span class="meta">(${shown.length})</span></h2>${videoList(shown, true)}</section>` : "")
        || `<p class="empty">${esc(label("no_results"))}</p>`;
      return;
    }
    if (!shown.length) { list.innerHTML = `<p class="empty">${esc(label("no_results"))}</p>`; return; }
    if (scope.kind === "playlist") { list.innerHTML = `<section>${videoList(shown, true)}</section>`; return; }  // playlist order
    shown = shown.slice().sort((a, b) => b.upload_date.localeCompare(a.upload_date));
    list.innerHTML = `<section>${videoList(shown)}</section>`;
  }

  // ---------- one video ----------
  let videoId = null;

  function timeLink(at, text) {
    const t = seconds(at);
    return `<a class="t" href="https://www.youtube.com/watch?v=${esc(videoId)}&amp;t=${t}s" data-t="${t}" target="_blank" rel="noopener">${esc(text || hms(t))}</a>`;
  }

  // Description: links become clickable, times seek the video.
  function richText(text) {
    return esc(text)
      .replace(/https?:\/\/[^\s<]+/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
      .replace(/(^|[\s(\[])((?:\d{1,2}:)?\d{1,2}:\d{2})(?=[\s)\],.-]|$)/gm, (_, before, t) => before + timeLink(t, t));
  }

  async function showVideo(id) {
    videoId = id;
    pageKind = "video";
    const wanted = new URLSearchParams(location.search).get("version");
    const v = await getJson(`/api/video/${encodeURIComponent(id)}${wanted ? `?version=${encodeURIComponent(wanted)}` : ""}`);
    const back = `<a class="back" href="/" data-nav>← ${esc(label("back"))}</a>`;
    if (v.error) {
      document.title = label("not_found");
      app.innerHTML = `<header class="top"><div>${back}<h1>${esc(label("not_found"))}</h1></div>${topButtons()}</header>`;
      return;
    }
    document.title = v.title;
    const s = v.summary;
    shownSummary = s;
    shownVersion = v.version;
    const meta = [v.channel ? `<a href="/c/${esc(v.channel_id)}" data-nav>${esc(v.channel)}</a>` : "",
      esc(day(v.upload_date)), hms(v.duration)].filter(Boolean).join(" · ");

    const topics = s ? s.topics.map(t => [t.start, t.title]) : (v.chapters || []).map(c => [c.start_time, c.title]);
    const topicsTitle = label(s ? "topics" : "chapters");
    const tocHtml = topics.length ? `
      <aside class="toc${s ? " with-flow" : ""}" id="toc" aria-label="${esc(topicsTitle)}"><div class="toc-topics"><h2>${esc(topicsTitle)}</h2>
        <ul class="topics">${topics.map(([t, title]) => `<li data-t="${seconds(t)}">${timeLink(t)} <span>${esc(title)}</span></li>`).join("")}</ul>
        </div>${s ? `<section class="flow-panel" id="flow-panel" aria-label="${esc(label("flow"))}"></section>` : ""}
      </aside>` : "";
    let tab = "overview";
    try { if (localStorage.getItem("yt-summary-tab") === "ideas") tab = "ideas"; } catch (e) {}

    const ideasHtml = s ? `
      <section class="ideas">
        ${s.ideas.map((idea, i) => `
          <article class="idea" data-t="${seconds(idea.start)}">
            <h3>${timeLink(idea.start)}<span class="n">${i + 1}</span><span>${esc(idea.title)}</span></h3>
            ${idea.highlight ? `<p class="highlight"><b>★ ${esc(label("highlight"))}</b><span>${esc(idea.highlight)}</span></p>` : ""}
            ${paragraphs(idea.summary)}
            ${idea.reasoning ? `<h4>${esc(label("reasoning"))}</h4>${paragraphs(idea.reasoning)}` : ""}
            ${idea.moments && idea.moments.length ? `<h4>${esc(label("moments"))}</h4>
              <ul class="moments">${idea.moments.map(m => `<li>${timeLink(m.start)} ${esc(m.text)}</li>`).join("")}</ul>` : ""}
          </article>`).join("")}
      </section>` : "";

    const noteHtml = s && s.note ? `<footer>${esc(label("regen_note_shown", {note: s.note}))}</footer>` : "";
    const descriptionHtml = v.description ? `<section><details open><summary>${esc(label("description"))}</summary>
        <div class="description">${richText(v.description)}</div></details></section>` : "";
    app.classList.toggle("wide", Boolean(topics.length));
    app.innerHTML = `
      <div class="bar">${v.channel_id ? `<nav class="crumbs">${back}<span class="sep" aria-hidden="true">/</span>
        <a class="back" href="/c/${esc(v.channel_id)}" data-nav>${esc(v.channel || v.channel_id)}</a></nav>` : back}
        ${topics.length ? `<button type="button" class="toc-toggle" aria-controls="toc" aria-expanded="false">${esc(topicsTitle)} ▾</button>` : ""}
        ${topButtons()}</div>
      <div class="video-layout${topics.length ? "" : " no-toc"}"><div class="main">
      <div class="pinned">
        <div class="player"><div class="frame"><div id="player"></div></div><p class="fallback">${esc(label("player_fallback"))}</p></div>
        ${s && s.flow ? `<div class="flow-mini" id="flow-mini" role="img" aria-label="${esc(label("flow"))}"></div>` : ""}
      </div>
      <header class="video-head"><div class="title-row"><h1>${esc(v.title)}</h1>
        ${s ? `<div class="head-tools">${versionPicker(v)}${CONFIG.summarize ? `<div id="regen"></div>` : ""}</div>` : ""}</div>
        <div class="meta">${meta} · <a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener">${esc(label("open_youtube"))}</a></div>
        ${v.version && s ? `<div class="old-version" role="status"><p>${esc(label("version_notice", {date: when(s.created_at) || v.version}))}</p>
          <a href="/v/${esc(id)}" data-nav>${esc(label("version_show_current"))}</a></div>` : ""}
      </header>
      ${s ? `
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" data-tab="overview">${esc(label("overview"))}</button>
        <button type="button" role="tab" id="tab-ideas" aria-controls="panel-ideas" data-tab="ideas">${esc(label("ideas"))} <span class="count">(${s.ideas.length})</span></button>
      </div>
      <div role="tabpanel" class="scroller" id="panel-overview" aria-labelledby="tab-overview">
        <section>${paragraphs(s.overview)}</section>
        ${descriptionHtml}${noteHtml}
      </div>
      <div role="tabpanel" class="scroller" id="panel-ideas" aria-labelledby="tab-ideas">${ideasHtml}${noteHtml}</div>`
      : `<div class="scroller"><section class="notice"><p>${esc(label("no_summary"))}</p>
              ${CONFIG.summarize && v.transcript ? `<div id="job-box"></div>` : ""}
              <p class="meta">${esc(label("no_summary_command"))}</p>
              <div class="command"><code>/yt-summary ${esc(id)}</code>
                <button type="button" data-copy="/yt-summary ${esc(id)}">${esc(label("copy"))}</button></div></section>
      ${descriptionHtml}</div>`}
      </div>${tocHtml}</div>`;
    tabScroll = {};
    if (s) showTab(tab);
    setFlow(s && s.flow, v.duration, s && s.ideas);
    startPlayer(id);
    showJobBox();
    showRegen();
  }

  // ---------- tabs of the video page ----------
  // Each tab scrolls on its own and keeps its place while the other one is shown.
  let tabScroll = {};
  const currentTab = () => document.querySelector('.tabs [aria-selected="true"]')?.dataset.tab;
  function showTab(name) {
    const before = currentTab();
    if (before) tabScroll[before] = scrollPos();
    document.querySelectorAll(".tabs [role=tab]").forEach(b => {
      const on = b.dataset.tab === name;
      b.setAttribute("aria-selected", String(on));
      b.tabIndex = on ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !on;
    });
    try { localStorage.setItem("yt-summary-tab", name); } catch (e) {}
    if (before !== name) setScroll(tabScroll[name] ?? 0);
  }
  document.addEventListener("click", e => {
    const button = e.target.closest(".tabs [role=tab]");
    if (button) showTab(button.dataset.tab);
  });
  document.addEventListener("keydown", e => {
    const button = e.target.closest(".tabs [role=tab]");
    if (!button || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
    const other = button.parentElement.querySelector(`[role=tab]:not([data-tab="${button.dataset.tab}"])`);
    showTab(other.dataset.tab);
    other.focus();
  });

  // ---------- summaries started from this page: the server runs Claude Code in the background ----------
  let jobs = {}, jobsTimer = null;
  const isActive = id => jobs[id] && (jobs[id].state === "queued" || jobs[id].state === "running");

  // Buttons of a channel or playlist page: missing summaries, and flows missing in existing summaries.
  const listButtons = list => summarizeListButton(list) + flowListButton(list);
  function flowListButton(list) {
    const missing = list.filter(v => v.summary && !v.flow && !isActive(v.id));
    if (!CONFIG.summarize || !missing.length) return "";
    const time = hms(missing.reduce((total, v) => total + v.duration, 0));
    return ` <button type="button" class="action secondary" data-mode="flow" data-summarize="${esc(missing.map(v => v.id).join(" "))}"
      data-confirm="${esc(label("flow_confirm", {n: missing.length, time, model: CONFIG.model}))}">${esc(label("flow_create_list", {n: missing.length}))}</button>`;
  }

  // Button for the videos of a channel or playlist that have a transcript but no summary yet.
  function summarizeListButton(list) {
    const missing = list.filter(v => !v.summary && v.transcript && !isActive(v.id));
    if (!CONFIG.summarize || !missing.length) return "";
    const time = hms(missing.reduce((total, v) => total + v.duration, 0));
    return `<button type="button" class="action" data-summarize="${esc(missing.map(v => v.id).join(" "))}"
      data-confirm="${esc(label("summarize_confirm", {n: missing.length, time, model: CONFIG.model}))}">${esc(label("summarize_channel", {n: missing.length}))}</button>`;
  }

  function showJobBox() {
    const box = document.getElementById("job-box");
    if (!box) return;
    const job = jobs[videoId] && jobs[videoId].mode !== "flow" ? jobs[videoId] : null;
    if (job && job.state === "queued") box.innerHTML = `<p class="job"><span class="spinner"></span>${esc(label("job_queued"))}</p>`;
    else if (job && job.state === "running") box.innerHTML = `<p class="job"><span class="spinner"></span>${esc(label("job_running"))}</p>`;
    else box.innerHTML = (job && job.state === "error" ? `<p class="job error">${esc(label("job_error", {error: job.error}))}</p>` : "")
      + `<button type="button" class="action" data-summarize="${esc(videoId)}">${esc(label("summarize"))}</button>`;
  }

  function showJobsIndicator() {
    const indicator = document.getElementById("jobs-indicator");
    const active = Object.keys(jobs).filter(isActive).length;
    if (indicator) indicator.innerHTML = active ? ` · <span class="spinner"></span>${esc(label("jobs_active", {n: active}))}` : "";
  }

  // Asks the server for the state of the summaries; keeps asking every few seconds while some are in progress.
  async function refreshJobs() {
    clearTimeout(jobsTimer);
    const before = JSON.stringify(jobs), previous = jobs;
    try { jobs = await getJson("/api/jobs"); } catch (e) { return; }
    if (JSON.stringify(jobs) !== before) {
      const finished = Object.keys(jobs).filter(id => jobs[id].state === "done" && (!previous[id] || previous[id].state !== "done"));
      if (pageKind === "video" && finished.includes(videoId)) {
        stopPlayer();
        await showVideo(videoId);  // the new summary appears in place
      } else if (pageKind === "video") {
        showJobBox();
        showFlowJob();
        showRegen();
      } else if (document.getElementById("list")) {
        if (finished.length) videos = await getJson("/api/videos");
        const fresh = new Map(videos.map(v => [v.id, v]));
        scoped = scoped.map(v => fresh.get(v.id) || v);
        renderList();
        document.querySelectorAll(".top .list-actions").forEach(el => { el.innerHTML = listButtons(scoped); });
        showJobsIndicator();
      }
    }
    if (Object.keys(jobs).some(isActive)) jobsTimer = setTimeout(refreshJobs, 3000);
  }

  document.addEventListener("click", async e => {
    const button = e.target.closest("button[data-summarize]");
    if (!button) return;
    e.preventDefault();
    if (button.dataset.confirm && !window.confirm(button.dataset.confirm)) return;
    button.disabled = true;
    const ids = button.dataset.summarize.split(" "), mode = button.dataset.mode || "summary";
    try {
      const response = await fetch("/api/summarize", {method: "POST",
        headers: {"Content-Type": "application/json", "X-Token": TOKEN}, body: JSON.stringify({ids, mode})});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
    } catch (err) {
      jobs = {...jobs, [ids[0]]: {state: "error", mode, error: err.message}};
    }
    await refreshJobs();
  });


  // ---------- regenerating a summary: at once with the defaults, or with the choices of the dialog ----------
  // The server keeps the current version as summary.<lang>.<date>.json first.
  const regenDialog = document.getElementById("regen-dialog");
  let shownSummary = null, shownVersion = null;

  // ---------- older versions of the summary: kept when it was made again, shown read-only ----------
  // A time of the summary in the reader's time zone: 2026-11-12 13:12.
  function when(iso) {
    const t = new Date(iso);
    if (!iso || isNaN(t)) return "";
    const two = n => String(n).padStart(2, "0");
    return `${t.getFullYear()}-${two(t.getMonth() + 1)}-${two(t.getDate())} ${two(t.getHours())}:${two(t.getMinutes())}`;
  }
  function versionPicker(v) {
    if (!v.versions || !v.versions.length) return "";
    const current = v.version ? null : v.summary;
    const options = [`<option value=""${v.version ? "" : " selected"}>${esc(label("version_current",
        {date: when((current || {}).created_at) || "–"}))}</option>`]
      .concat(v.versions.map(x => `<option value="${esc(x.version)}"${x.version === v.version ? " selected" : ""}>${
        esc(label("version_old", {date: when(x.created_at) || x.version}))}</option>`));
    return `<span class="version-pick"><select id="version-pick" aria-label="${esc(label("version"))}"
      title="${esc(label("version"))}">${options.join("")}</select></span>`;
  }
  document.addEventListener("change", e => {
    if (e.target.id !== "version-pick") return;
    const version = e.target.value;
    history.pushState(null, "", `/v/${encodeURIComponent(videoId)}${version ? `?version=${encodeURIComponent(version)}` : ""}`);
    route();
  });
  const modelName = m => m === "inherit" ? label("settings_model_inherit") : m[0].toUpperCase() + m.slice(1);

  function showRegen() {
    const box = document.getElementById("regen");
    if (!box) return;
    const job = jobs[videoId];
    const flowJob = job && job.mode === "flow";
    if (job && (job.state === "queued" || job.state === "running")) {
      box.innerHTML = `<p class="job"><span class="spinner"></span>${esc(label(
        job.state === "queued" ? (flowJob ? "flow_job_queued" : "job_queued") : (flowJob ? "flow_job_running" : "job_running")))}</p>`;
      return;
    }
    box.innerHTML = `<div class="split">
        <button type="button" data-regen title="${esc(label("regen_hint", {model: modelName(CONFIG.model)}))}">⟳ ${esc(label("regen"))}</button>
        <button type="button" data-regen-more aria-haspopup="dialog" aria-label="${esc(label("regen_more"))}" title="${esc(label("regen_more"))}">▾</button></div>`
      + (job && job.state === "error" ? `<p class="job error">${esc(label(flowJob ? "flow_job_error" : "job_error", {error: job.error}))}</p>` : "");
  }

  async function regenerate(mode, model, note) {
    const box = document.getElementById("regen");
    box?.querySelectorAll("button").forEach(b => { b.disabled = true; });
    try {
      const response = await fetch("/api/summarize", {method: "POST",
        headers: {"Content-Type": "application/json", "X-Token": TOKEN},
        body: JSON.stringify({ids: [videoId], mode, regenerate: true, model, note})});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (result.skipped && result.skipped[videoId]) throw new Error(result.skipped[videoId]);
      if (shownVersion) {
        history.pushState(null, "", `/v/${encodeURIComponent(videoId)}`);
        await route();
      }
    } catch (err) {
      jobs = {...jobs, [videoId]: {state: "error", mode, error: err.message}};
    }
    await refreshJobs();
    showRegen();
  }

  function openRegen() {
    const note = (shownSummary && shownSummary.note) || "";
    const models = CONFIG.models || [];
    regenDialog.setAttribute("aria-label", label("regen_title"));
    regenDialog.innerHTML = `<div class="add-head"><h2>${esc(label("regen_title"))}</h2>
        <button type="button" class="add-close" data-regen-close aria-label="${esc(label("add_close"))}">×</button></div>
      <form class="add-body regen-form" id="regen-form">
        <fieldset><legend>${esc(label("regen_what"))}</legend>
          <label class="check"><input type="radio" name="regen-mode" value="summary" checked>
            <span>${esc(label("regen_summary"))}<span class="note">${esc(label("regen_summary_note"))}</span></span></label>
          <label class="check"><input type="radio" name="regen-mode" value="flow">

  document.addEventListener("click", e => {
    if (e.target.closest("button[data-regen]")) regenerate("summary", "", (shownSummary && shownSummary.note) || "");
    else if (e.target.closest("button[data-regen-more]")) openRegen();
