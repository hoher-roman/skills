<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Správy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5fd0'/%3E%3Crect x='13' y='14' width='38' height='8' rx='2' fill='%23fff'/%3E%3Crect x='13' y='28' width='17' height='22' rx='2' fill='%23fff' opacity='.85'/%3E%3Crect x='35' y='28' width='16' height='4' rx='2' fill='%23fff' opacity='.85'/%3E%3Crect x='35' y='37' width='16' height='4' rx='2' fill='%23fff' opacity='.85'/%3E%3Crect x='35' y='46' width='11' height='4' rx='2' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1f23; --muted: #6b7079; --line: #e3e1dc;
  --accent: #2f5fd0; --chip: #efeee9; --chip-on: #1d1f23; --chip-on-text: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171a; --panel: #1d2024; --text: #e7e8ea; --muted: #9196a0; --line: #2d3137;
    --accent: #7ea2ff; --chip: #262a2f; --chip-on: #e7e8ea; --chip-on-text: #15171a; --shadow: none; }
}
* { box-sizing: border-box; }
/* room for the scrollbar on every tab, so a short tab without one does not shift the page */
html { overflow-y: scroll; scrollbar-gutter: stable; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.day { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.day a, .day select, .search {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; text-decoration: none; }
.day a.off { opacity: .35; pointer-events: none; }
.date { color: var(--muted); font-size: 14px; }
.bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; }
.tab { font: inherit; font-size: 14px; border: 0; background: none; color: var(--muted); cursor: pointer;
  padding: 4px 12px; border-radius: 8px; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); outline: 1px solid var(--line); }
.tab .n { font-weight: 400; color: var(--muted); font-size: 12px; }
.search { flex: 1 1 200px; min-width: 0; max-width: 420px; margin-left: auto; }
.jump { display: none; gap: 10px; font-size: 13px; }
.jump a { color: var(--accent); text-decoration: none; }
.cols { display: grid; grid-template-columns: 1fr; gap: 0 40px; }
.col { min-width: 0; }
.col-head { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 0; padding-bottom: 6px; border-bottom: 2px solid var(--text);
  scroll-margin-top: 120px; }
.col-head h2 { font-size: 18px; margin: 0; font-weight: 700; }
.col-head .n { color: var(--muted); font-size: 13px; }
.single .col-head { display: none; }
@media (min-width: 1000px) { .multi .cols { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); } }
@media (max-width: 999px) { .multi .jump { display: flex; } }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.chip { font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 3px 10px; cursor: pointer;
  background: var(--chip); color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .n { color: var(--muted); font-size: 12px; }
.chip.on { background: var(--chip-on); color: var(--chip-on-text); }
.chip.on .n { color: inherit; opacity: .7; }
.row-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.stats { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
ol { list-style: none; margin: 0; padding: 0; }
li.item { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
li.item > div { min-width: 0; }
.time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 3px; font-size: 12px; }
.tag { border-radius: 4px; padding: 0 6px; font-weight: 600; color: #fff; }
.tag.region { background: var(--chip); color: var(--muted); font-weight: 500; }
.text { margin: 0; }
.headline { font-weight: 600; }
.perex { color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.meta a { color: var(--accent); text-decoration: none; }
.meta a:hover { text-decoration: underline; }
.meta .orig { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.also summary { cursor: pointer; color: var(--muted); }
details.also ul { margin: 4px 0 0; padding-left: 18px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
body:not(.news-tab) .news, body:not(.news-tab) .search { display: none; }
body.news-tab .digest, body.news-tab .col-head, body.news-tab .jump, body.news-tab .col:not(.active) { display: none !important; }
body.news-tab .cols { grid-template-columns: 1fr !important; }
/* tab of all news: the list on the left, the filters in a panel on the right that stays in view */
.side-label { font-size: 12px; color: var(--muted); margin: 14px 0 -4px; text-transform: uppercase; letter-spacing: .04em; }
.side .search { max-width: none; width: 100%; margin: 14px 0 0; }
@media (min-width: 1000px) {
  .news { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0 40px; align-items: start; }
  .side { grid-column: 2; grid-row: 1; position: sticky; top: var(--head, 110px); padding-bottom: 16px;
    max-height: calc(100vh - var(--head, 110px)); overflow-y: auto; }
  .news-main { grid-column: 1; grid-row: 1; min-width: 0; }
}
.intro { font-size: 17px; line-height: 1.6; margin: 14px 0 8px; }
ol.top { counter-reset: top; }
ol.top li.item { grid-template-columns: 28px 52px 1fr; }
ol.top li.item::before { counter-increment: top; content: counter(top); font-size: 20px; font-weight: 650;
  color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
.note a { color: var(--accent); cursor: pointer; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 560px) {
  li.item { grid-template-columns: 1fr; gap: 2px; }
  ol.top li.item { grid-template-columns: 28px 1fr; }
  ol.top li.item .time { display: none; }
  .day { margin-left: 0; width: 100%; }
  .day select { flex: 1; min-width: 0; }
  .search { max-width: none; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="top">
      <h1>Správy</h1>
      <span class="date" id="date"></span>
      <nav class="day">
        <a id="newer" href="#" title="Novší deň (←)">‹</a>
        <select id="days" aria-label="Deň"></select>
        <a id="older" href="#" title="Starší deň (→)">›</a>
      </nav>
    </div>
    <div class="bar">
      <nav class="tabs" id="tabs"></nav>
      <nav class="jump" id="jump"></nav>
      <input class="search" id="q" type="search" placeholder="Hľadať…" aria-label="Hľadať">
    </div>
  </header>
  <main class="cols" id="cols"></main>
  <footer id="foot"></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("news." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("news." + k, JSON.stringify(v)); } catch (e) {} }
};
const items = (DATA && DATA.items) || [];
const SECTIONS = (DATA && DATA.sections && DATA.sections.length) ? DATA.sections
  : [{ id: "main", label: "Správy", tab: "Všetky správy", areas: null, digest: DATA && DATA.digest }];
const MAIN = SECTIONS[0].id;
const q = { text: "" };
// filters per column; the first column keeps the keys of the single-column page
const key = (sid, k) => sid === MAIN ? k : `${k}.${sid}`;
const state = Object.fromEntries(SECTIONS.map(s => [s.id, {
  areas: new Set(store.get(key(s.id, "areas"), [])), groups: new Set(store.get(key(s.id, "groups"), [])) }]));
const sectionItems = sid => items.filter(it => (it.section || MAIN) === sid);
const areaInfo = id => (DATA.areas[id] || { label: id, color: "#7b8088" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";
const fold = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "");
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("sk-SK", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fmtTime = t => new Date(t).toLocaleTimeString("sk-SK", { hour: "2-digit", minute: "2-digit" });
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const hasDigest = SECTIONS.some(s => s.digest);
// tabs: "sumar" (summaries of all sections) and one tab with all news per section; #spravy is the first section
const tabHash = name => name === "sumar" ? "" : name === MAIN ? "#spravy" : "#" + name;
const tabOfHash = () => {
  const h = location.hash.slice(1);
  if (h === "spravy") return MAIN;
  return SECTIONS.some(s => s.id === h) && h !== MAIN ? h : "sumar";
};

function dayNav() {
  const days = DATA.days || [];
  const sel = $("days");
  sel.innerHTML = days.map(d => `<option value="${d.day}"${d.day === DATA.day ? " selected" : ""}>${d.day} (${d.count})</option>`).join("");
  sel.onchange = () => location.href = sel.value + ".html" + location.hash;
  const i = days.findIndex(d => d.day === DATA.day);
  const newer = days[i - 1], older = days[i + 1];
  $("newer").href = newer ? newer.day + ".html" : "#"; $("newer").classList.toggle("off", !newer);
  $("older").href = older ? older.day + ".html" : "#"; $("older").classList.toggle("off", !older);
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "ArrowLeft" && newer) location.href = newer.day + ".html" + location.hash;
    if (e.key === "ArrowRight" && older) location.href = older.day + ".html" + location.hash;
  });
  $("date").textContent = DATA.day ? fmtDay(DATA.day) : "";
}

function columns() {
  const multi = SECTIONS.length > 1;
  $("wrap").classList.toggle("multi", multi);
  $("wrap").classList.toggle("single", !multi);
  $("cols").style.setProperty("--n", SECTIONS.length);
  $("cols").innerHTML = SECTIONS.map(s => `
    <section class="col" id="col-${esc(s.id)}">
      <div class="col-head"><h2>${esc(s.label)}</h2><span class="n" id="count-${esc(s.id)}"></span></div>
      <div class="digest" id="digest-${esc(s.id)}"></div>
      <div class="news">
        <aside class="side">
          <div class="side-search" id="search-${esc(s.id)}"></div>
          <div class="side-label">Oblasti</div>
          <div class="filters" id="areas-${esc(s.id)}"></div>
          <div class="side-label" id="groups-label-${esc(s.id)}">Zdroje</div>
          <div class="filters" id="groups-${esc(s.id)}"></div>
        </aside>
        <div class="news-main">
          <div class="stats" id="stats-${esc(s.id)}"></div>
          <ol id="list-${esc(s.id)}"></ol>
        </div>
      </div>
    </section>`).join("");
  $("tabs").innerHTML = (hasDigest ? `<button class="tab" data-tab="sumar">Prehľad dňa</button>` : "") +
    SECTIONS.map(s => `<button class="tab" data-tab="${esc(s.id)}">${esc(s.tab || s.label)} <span class="n">${sectionItems(s.id).length}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $("jump").innerHTML = multi ? SECTIONS.map(s => `<a href="#col-${esc(s.id)}" data-col="${esc(s.id)}">↓ ${esc(s.label)}</a>`).join("") : "";
  $("jump").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); $("col-" + a.dataset.col).scrollIntoView(); });
}

function matches(it, st, skip) {
  if (skip !== "area" && st.areas.size && !st.areas.has(it.area)) return false;
  if (skip !== "group" && st.groups.size && !st.groups.has(it.group)) return false;
  if (q.text) {
    const hay = fold([it.text, it.title, it.source, it.region, areaInfo(it.area).label].join(" "));
    if (!q.text.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function chips(sid, kind, values, render) {
  const box = $(`${kind}-${sid}`);
  const set = state[sid][kind];
  box.innerHTML = "";
  if (kind === "groups") $(`groups-label-${sid}`).style.display = values.length ? "" : "none";
  for (const v of values) {
    const b = document.createElement("button");
    b.className = "chip" + (set.has(v) ? " on" : "");
    b.innerHTML = render(v);
    b.title = "Ctrl+klik: len táto";
    b.onclick = e => {
      if (e.ctrlKey || e.metaKey) {
        const only = set.size === 1 && set.has(v);
        set.clear();
        if (!only) set.add(v);
      } else {
        set.has(v) ? set.delete(v) : set.add(v);
      }
      store.set(key(sid, kind), [...set]); draw();
    };
    box.appendChild(b);
  }
}

function draw() {
  for (const s of SECTIONS) {
    const st = state[s.id], its = sectionItems(s.id);
    const areaCount = {}, groupCount = {};
    for (const it of its) {
      if (matches(it, st, "area")) areaCount[it.area] = (areaCount[it.area] || 0) + 1;
      if (matches(it, st, "group")) groupCount[it.group] = (groupCount[it.group] || 0) + 1;
    }
    const areaIds = Object.keys(DATA.areas).filter(a => areaCount[a] || st.areas.has(a));
    chips(s.id, "areas", areaIds, id =>
      `<span class="dot" style="background:${esc(areaInfo(id).color)}"></span>${esc(areaInfo(id).label)} <span class="n">${areaCount[id] || 0}</span>`);
    const groups = [...new Set(its.map(i => i.group).filter(Boolean))];
    chips(s.id, "groups", groups.length > 1 || st.groups.size ? groups : [], g => `${esc(g)} <span class="n">${groupCount[g] || 0}</span>`);

    const shown = its.filter(it => matches(it, st));
    $(`list-${s.id}`).innerHTML = shown.map(it => row(it)).join("") ||
      `<li class="empty">${its.length ? "Filtru nezodpovedá žiadna správa." : "Pre tento deň tu nie sú žiadne správy."}</li>`;
    const ai = its.filter(i => i.ai).length;
    $(`stats-${s.id}`).textContent = `${shown.length} z ${its.length} ${plural(its.length, "správy", "správ", "správ")}` +
      (DATA.mode === "claude" && ai < its.length ? ` · ${its.length - ai} bez zhrnutia od Clauda (zobrazený perex zdroja)` : "");
    $(`count-${s.id}`).textContent = its.length;
  }
}

function tab(name) {
  if (name === "sumar" && !hasDigest) name = MAIN;
  const news = name !== "sumar";
  document.body.classList.toggle("news-tab", news);
  document.querySelectorAll(".col").forEach(c => c.classList.toggle("active", c.id === "col-" + name));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  if (news) $(`search-${name}`).appendChild($("q"));  // one search box, in the panel of the open tab
  document.documentElement.style.setProperty("--head", document.querySelector("header").offsetHeight + "px");
  $("tabs").style.display = hasDigest || SECTIONS.length > 1 ? "" : "none";
  for (const id of ["newer", "older"]) {
    const a = $(id); a.href = a.href.split("#")[0] + tabHash(hasDigest || name !== MAIN ? name : "sumar");
  }
}

function setTab(name) {
  history.replaceState(null, "", tabHash(name) || location.pathname + location.search);
  tab(name);
  window.scrollTo(0, 0);
}

function digests() {
  for (const s of SECTIONS) {
    const d = s.digest, box = $(`digest-${s.id}`), total = sectionItems(s.id).length;
    if (!d) {
      box.innerHTML = `<p class="note">Pre tento deň tu zatiaľ nie sú žiadne správy.</p>`;
      continue;
    }
    const note = d.kind === "claude"
      ? `Prehľad napísal Claude ${esc(new Date(d.at).toLocaleString("sk-SK", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }))}` +
        (d.newer ? ` · odvtedy pribudlo ${d.newer} ${plural(d.newer, "zhrnutá správa", "zhrnuté správy", "zhrnutých správ")}` : "")
      : "Automatický výber: správy, o ktorých píše najviac zdrojov. Prehľad od Clauda zatiaľ nie je.";
    box.innerHTML =
      (d.intro ? `<p class="intro">${esc(d.intro)}</p>` : "") +
      `<ol class="top">${d.stories.map(it => row(it, it.digest_text)).join("")}</ol>` +
      `<p class="note">${note} · <a data-to-news="${esc(s.id)}">${esc(s.tab || s.label)} (${total}) →</a></p>`;
  }
  document.querySelectorAll("[data-to-news]").forEach(a => a.onclick = () => setTab(a.dataset.toNews));
}

function row(it, digestText) {
  const a = areaInfo(it.area);
  const url = esc(safeUrl(it.url));
  const body = digestText ? `<p class="text">${esc(digestText)}</p>` : it.ai
    ? `<p class="text">${esc(it.text)}</p>`
    : `<p class="text"><a class="headline" href="${url}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>${it.text ? ` <span class="perex">${esc(it.text)}</span>` : ""}</p>`;
  const also = it.also.length ? `<details class="also"><summary>+${it.also.length} ${plural(it.also.length, "ďalší zdroj", "ďalšie zdroje", "ďalších zdrojov")}</summary><ul>${
    it.also.map(o => `<li><a href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener noreferrer">${esc(o.source)}</a>: ${esc(o.title)}</li>`).join("")}</ul></details>` : "";
  return `<li class="item">
    <div class="time" title="${it.dated ? esc(new Date(it.time).toLocaleString("sk-SK")) : "Zdroj neuvádza čas; stiahnuté " + esc(new Date(it.time).toLocaleString("sk-SK"))}">${it.dated ? fmtTime(it.time) : "bez času"}</div>
    <div>
      <div class="tags"><span class="tag" style="background:${esc(a.color)}">${esc(a.label)}</span>${it.region ? `<span class="tag region">${esc(it.region)}</span>` : ""}</div>
      ${body}
      <div class="meta"><a class="orig" href="${url}" target="_blank" rel="noopener noreferrer" title="${esc(it.title)}">${esc(it.source)}${it.ai || digestText ? ": " + esc(it.title) : ""} ↗</a>${also}</div>
    </div>
  </li>`;
}

if (!DATA || !DATA.day) {
  document.querySelector(".wrap").innerHTML = '<p class="empty">Zatiaľ žiadne správy. Spusti /news alebo news.cmd.</p>';
} else {
  dayNav();
  columns();
  window.addEventListener("hashchange", () => tab(tabOfHash()));
  digests();
  tab(tabOfHash());
  $("q").oninput = e => { q.text = fold(e.target.value.trim()); draw(); };
  $("foot").textContent = "Aktualizované " + new Date(DATA.generated).toLocaleString("sk-SK") + " · stiahnuté len zo zdrojov v konfigurácii, uložené lokálne";
  draw();
}
</script>
</body>
</html>
