# Settings of the /news skill. Sources are in the other .toml files of this folder,
# one file per technology: rss.toml, sitemap.toml, html.toml.

[general]
# How the short texts are made:
#   "claude"  /news has Claude write a Slovak summary of 1-2 sentences and set the area and region
#             (items not summarized yet show the script text until then)
#   "script"  the perex from the source, cut to 1-2 sentences, area by keywords below; no AI,
#             runs without Claude (news.cmd), texts stay in the language of the source
summary_mode = "claude"

# Only items published in the last N hours are taken on each fetch.
window_hours = 36
# Items older than N days are removed from the archive.
retention_days = 30
# At most N newest items from one source per fetch (a source can override it with max_items).
max_items_per_source = 40
# Two headlines of the same language with this share of common words are one story with several sources (0-1).
duplicate_similarity = 0.6
# Seconds to wait for one source.
timeout = 20
# Where the HTML overview is written; empty means the "site" folder next to this config folder.
site_dir = ""

[claude]
# Model of the subagents that write the summaries: "sonnet", "haiku", or "inherit" (same as the conversation).
model = "sonnet"
# Items per subagent, and how many subagents run at once.
batch_size = 40
parallel = 3

# Areas of the news. `label` is shown in the overview, `color` is its tag color.
# `keywords` are used only by the script (summary_mode = "script", or before Claude summarizes):
# an area wins when a word of the headline, the source's categories or the article URL starts with one of them
# (lowercase, without diacritics). Claude chooses the area by meaning.

[areas.politika]
label = "Politika"
color = "#3b6fd4"
keywords = ["politik", "politic", "vlad", "vlád", "parlament", "snem", "snemov", "poslan", "minist", "premier", "premiér", "prezident", "volb", "volieb", "election", "koalic", "opozic", "strana", "smer", "hlas-sd", "progresiv", "senat", "senát", "congress", "kongres", "eu-", "brusel", "domov", "domaci", "fico", "babis", "trump"]

